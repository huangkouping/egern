name: Normalize Egern module descriptions
on:
  push:
    paths:
      - '*.yaml'
      - 'scripts/*-base.yaml'
      - 'scripts/normalize-module-descriptions.py'
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: python scripts/normalize-module-descriptions.py
      - name: Commit normalized descriptions
        run: |
          if ! git diff --quiet -- '*.yaml'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.yaml'
            git commit -m "Normalize Egern module description timestamp position"
            git push
          fi
