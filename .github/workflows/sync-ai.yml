name: 同步 AI 服务代理规则集

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ai-rules
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 拉取上游并生成 ai.list
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM="https://kelee.one/Tool/Loon/Lsr/AI.lsr"
          TMP="$(mktemp)"
          BODY="$(mktemp)"

          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 15 "$UPSTREAM" -o "$TMP"

          # 去掉上游注释/空行，只保留实际规则；最终文件统一使用本仓库说明头。
          grep -vE '^[[:space:]]*(#|$)' "$TMP" > "$BODY" || true

          TIME_BJ="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          {
            echo '# AI 服务代理规则集（含 Muse）'
            echo '# 本文件由 GitHub Actions 自动同步生成，请勿直接编辑生成内容'
            echo "# 规则内容更新时间（北京时间）：$TIME_BJ"
            echo "# 上游来源：$UPSTREAM"
            echo '# 使用方法：在 Egern 中订阅本文件，并将策略设置为“AI”'
            echo '# 合并策略：完整保留上游 AI 规则，并自动追加 Muse / Meta AI 自定义规则'
            echo
            echo '# ===== 上游 AI 服务规则 ====='
            cat "$BODY"
            echo
            echo '# ===== Muse / Meta AI 自定义规则 ====='
            printf '%s\n' \
              'DOMAIN-SUFFIX,meta.ai' \
              'DOMAIN-SUFFIX,ai.meta.com' \
              'DOMAIN-SUFFIX,muse.com' \
              'DOMAIN-SUFFIX,muse.ai' \
              'DOMAIN,api.meta.ai' \
              'DOMAIN,graph.meta.ai' \
              'DOMAIN,www.meta.ai' \
              'DOMAIN-KEYWORD,meta-ai' \
              'DOMAIN-KEYWORD,metaai'
          } > ai.list.new

          # 保留段落注释，同时仅对实际规则去重。
          awk '
            /^#/ || /^[[:space:]]*$/ { print; next }
            !seen[$0]++ { print }
          ' ai.list.new > ai.list
          rm -f ai.list.new "$TMP" "$BODY"

      - name: 提交更新
        shell: bash
        run: |
          if git diff --quiet -- ai.list; then
            echo "规则无变化。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.list
          git commit -m "自动同步 AI 规则集"
          git push
