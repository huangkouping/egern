name: Sync public adblock mirrors
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-amap.yml
      - scripts/sync-amap.py
      - scripts/sync-colorfulclouds.py
      - scripts/sync-pinduoduo.py
      - scripts/pinduoduo-base.yaml
      - scripts/sync-netease-news.py
      - scripts/netease-news-base.yaml
      - scripts/sync-aliyundrive.py
      - scripts/aliyundrive-base.yaml
      - scripts/sync-umetrip.py
      - scripts/umetrip-base.yaml
      - scripts/sync-railway12306.py
      - scripts/railway12306-base.yaml
      - scripts/sync-xiaojukeji-charge.py
      - scripts/xiaojukeji-charge-base.yaml
      - scripts/sync-netease-cloudmusic.py
      - scripts/netease-cloudmusic-base.yaml
      - scripts/netease-cloudmusic-adapter.js
      - scripts/sync-weixin-mini-programs.py
      - scripts/weixin-mini-programs-base.yaml
      - scripts/weixin-mini-programs-manifest.json
      - scripts/sync-bilibili.py
      - scripts/bilibili-base.yaml
      - scripts/bilibili-adapter.js
      - tests/test-bilibili.mjs
      - scripts/sync-youtube-subtitles.py
      - tests/test-youtube-official-sync.py
      - scripts/amap-base.yaml
      - tests/test-amap-sync.py
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sync-amap
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install PyYAML==6.0.2
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      - name: Verify last-good retention and recovery
        run: python tests/test-amap-sync.py
      - name: Synchronize two public mirror files
        id: sync
        continue-on-error: true
        run: python scripts/sync-amap.py
      - name: Synchronize ColorfulClouds public script mirror
        id: colorfulclouds
        continue-on-error: true
        run: python scripts/sync-colorfulclouds.py
      - name: Synchronize PDD pickup dependencies
        id: pinduoduo
        continue-on-error: true
        run: python scripts/sync-pinduoduo.py
      - name: Synchronize NetEase News public script mirror
        id: neteasenews
        continue-on-error: true
        run: python scripts/sync-netease-news.py
      - name: Synchronize AliYunDrive public script mirror
        id: aliyundrive
        continue-on-error: true
        run: python scripts/sync-aliyundrive.py
      - name: Synchronize Umetrip public script mirror
        id: umetrip
        continue-on-error: true
        run: python scripts/sync-umetrip.py
      - name: Synchronize 12306 public script mirror
        id: railway12306
        continue-on-error: true
        run: python scripts/sync-railway12306.py
      - name: Synchronize Xiaojukeji Charge page bundle
        id: xiaojukejicharge
        continue-on-error: true
        run: python scripts/sync-xiaojukeji-charge.py
      - name: Synchronize NetEase Cloud Music public script mirror
        id: neteasecloudmusic
        continue-on-error: true
        run: python scripts/sync-netease-cloudmusic.py
      - name: Synchronize all Weixin mini program scripts and image
        id: weixinmini
        continue-on-error: true
        run: python scripts/sync-weixin-mini-programs.py
      - name: Synchronize Bilibili scripts and JQ after functional checks
        id: bilibili
        continue-on-error: true
        run: python scripts/sync-bilibili.py
      - name: Synchronize official DualSubs YouTube release
        id: youtubesubtitles
        continue-on-error: true
        run: |
          python tests/test-youtube-official-sync.py
          python scripts/sync-youtube-subtitles.py
      - name: Commit valid rules or failure status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add amap-adblock.yaml amap-updatable.jq amap-search_poi_detail.jq amap-sync-status.json colorfulclouds-adblock.yaml colorfulclouds-adblock.js colorfulclouds-sync-status.json pinduoduo-adblock.yaml pinduoduo-pickup.js pinduoduo-sync-status.json netease-news-kelee.yaml netease-news-kelee.js netease-news-sync-status.json aliyundrive-adblock.yaml aliyundrive-adblock.js aliyundrive-sync-status.json umetrip-adblock.yaml umetrip-adblock.js umetrip-sync-status.json railway12306-adblock.yaml railway12306-adblock.js railway12306-sync-status.json xiaojukeji-charge-adblock.yaml xiaojukeji-charge-adblock.js xiaojukeji-charge-sync-status.json netease-cloudmusic-adblock.yaml netease-cloudmusic-adblock.js netease-cloudmusic-sync-status.json weixin-mini-programs-adblock.yaml weixin-mini-programs-adblock.js weixin-mini-programs-cyys1.jpg weixin-mini-programs-sync-status.json bilibili-adblock.yaml bilibili-request.js bilibili-response.js bilibili-json.js bilibili-tab.jq bilibili-mine.jq bilibili-sync-status.json youtube-subtitles-translation.yaml youtube-subtitles-sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Amap public JQ mirrors and status'
            git pull --rebase
            git push
          fi
      - name: Report failed synchronization
        if: steps.sync.outcome == 'failure' || steps.colorfulclouds.outcome == 'failure' || steps.pinduoduo.outcome == 'failure' || steps.neteasenews.outcome == 'failure' || steps.aliyundrive.outcome == 'failure' || steps.umetrip.outcome == 'failure' || steps.railway12306.outcome == 'failure' || steps.xiaojukejicharge.outcome == 'failure' || steps.neteasecloudmusic.outcome == 'failure' || steps.weixinmini.outcome == 'failure' || steps.bilibili.outcome == 'failure' || steps.youtubesubtitles.outcome == 'failure'
        run: exit 1
