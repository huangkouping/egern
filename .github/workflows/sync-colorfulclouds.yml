name: 彩云天气去广告同步

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-colorfulclouds.yml'
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-colorfulclouds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install PyYAML
      - name: 同步彩云天气模块
        id: sync
        continue-on-error: true
        run: python scripts/sync-colorfulclouds.py
      - name: 提交同步结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add colorfulclouds-adblock.yaml colorfulclouds-adblock.js colorfulclouds-sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m "自动同步彩云天气去广告模块"
            git push
          fi
      - name: 检查同步状态
        if: steps.sync.outcome == 'failure'
        run: exit 1
