name: 墨鱼去开屏同步

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-ddgksf-splash.yml'
      - 'scripts/sync-ddgksf-splash.py'
  schedule:
    - cron: '40 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-ddgksf-splash
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: python -m pip install PyYAML
      - name: 同步墨鱼去开屏规则
        id: sync
        continue-on-error: true
        run: python scripts/sync-ddgksf-splash.py
      - name: 提交同步文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ddgksf2013-splash.yaml ddgksf2013-splash-sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m "自动同步墨鱼去开屏规则"
            git push
          fi
      - name: 检查同步结果
        if: steps.sync.outcome == 'failure'
        run: exit 1
