name: Sync JD adblock upstream
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-jd-adblock.yml'
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/sync-jd-adblock.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jd-adblock.js
          if ! git diff --cached --quiet; then
            git commit -m 'Sync JD v2 upstream logic'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
