name: Sync PingMe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-pingme.yml"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and customize PingMe
        run: |
          sync_status="成功"
          if curl -fsSL https://raw.githubusercontent.com/mickeu/Egern/main/pingme.yaml -o /tmp/pingme-upstream.yaml; then
            mv /tmp/pingme-upstream.yaml pingme.yaml
          else
            sync_status="失败（沿用现有版本）"
          fi

          export SYNC_STATUS="$sync_status"
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import os
          import re

          path = Path("pingme.yaml")
          text = path.read_text()
          status = os.environ["SYNC_STATUS"]
          now = datetime.now().astimezone().strftime("%Y-%m-%d %H:%M")
          old_time = re.search(r"更新时间：([^（\n]+)", text)
          updated_at = now if status == "成功" else (old_time.group(1).strip() if old_time else "未知")
          text = re.sub(
              r"(?m)^name:.*$",
              "name: PingMe签到©️",
              text,
              count=1,
          )
          text = re.sub(
              r"(?m)^description:[^\n]*\n(?:^[ \t]+.*\n)*",
              "description: |-\n"
              "  PingMe 自动签到\n"
              f"  更新时间：{updated_at}\n"
              f"  同步状态：{status}\n",
              text,
              count=1,
          )
          text = re.sub(
              r"(?m)^  arg3:.*$",
              "  arg3: '0 */4 * * *'",
              text,
              count=1,
          )
          text = re.sub(
              r"(?m)^  PROXY: .*$",
              "  PROXY: 美国节点",
              text,
              count=1,
          )
          text = re.sub(
              r"(?ms)^compat_arguments_schema:\n.*?(?=^env:)",
              "compat_arguments_schema:\n"
              "  arg3:\n"
              "    name: 签到时间\n"
              "    description: 默认每天0点开始，每4小时签到一次；可填写 Cron 表达式调整。\n"
              "    default_value: '0 */4 * * *'\n"
              "  PROXY:\n"
              "    name: 代理策略\n"
              "    description: 填写主配置中的策略组名称，需完全一致；例如“美国节点”。\n"
              "    default_value: 美国节点\n",
              text,
              count=1,
          )
          text = re.sub(
              r"(?ms)^env_schema:\n.*?(?=^author:)",
              "env_schema:\n"
              "  PINGME_CAPTURE:\n"
              "    name: 抓取签到参数\n"
              "    description: 默认开启。关闭后不再抓取签到参数；脚本每次运行会随机生成设备ID。\n"
              "    default_value: 'true'\n"
              "    options:\n"
              "    - 'true'\n"
              "    - 'false'\n",
              text,
              count=1,
          )
          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pingme.yaml
          git diff --cached --quiet || git commit -m "Sync PingMe module"
          git push
