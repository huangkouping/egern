name: Sync PingMe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-pingme.yml"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and customize PingMe
        run: |
          curl -fsSL https://raw.githubusercontent.com/mickeu/Egern/main/pingme.yaml -o pingme.yaml
          sed -i \
            -e 's/^  PROXY: PROXY$/  PROXY: 美国节点/' \
            -e 's/^    name: PROXY$/    name: 美国节点/' \
            -e 's/^    default_value: PROXY$/    default_value: 美国节点/' \
            -e 's/^    - PROXY$/    - 美国节点/' \
            -e 's/policy: PROXY/policy: 美国节点/g' \
            pingme.yaml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pingme.yaml
          git diff --cached --quiet || git commit -m "Sync PingMe module"
          git push
