name: Sync PingMe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-pingme.yml"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and customize PingMe
        run: |
          curl -fsSL https://raw.githubusercontent.com/mickeu/Egern/main/pingme.yaml -o pingme.yaml
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pingme.yaml")
          text = path.read_text()
          text = re.sub(
              r"(?m)^description:.*$",
              "description: 😀 PingMe每日签到与任务｜支持签到参数抓取｜代理策略可自由填写（需与主配置名称一致）｜自动同步 mickeu/Egern 原版更新",
              text,
              count=1,
          )
          text = re.sub(
              r"(?m)^  PROXY: .*$",
              "  PROXY: 美国节点",
              text,
              count=1,
          )
          text = re.sub(
              r"(?ms)^  PROXY:\n.*?(?=^env:)",
              "  PROXY:\n"
              "    name: 代理策略\n"
              "    description: 输入主配置中的策略组名称，需与配置文件完全一致\n"
              "    default_value: 美国节点\n",
              text,
              count=1,
          )
          path.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pingme.yaml
          git diff --cached --quiet || git commit -m "Sync PingMe module"
          git push
