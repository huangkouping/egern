name: Sync Tencent Video upstream
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate upstream
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 40 'https://raw.githubusercontent.com/ZenmoFeiShi/Qx/main/Txvideoad.js' -o /tmp/txvideo.js
          test "$(wc -c </tmp/txvideo.js)" -gt 1000
          node --check /tmp/txvideo.js
          grep -q '\$done' /tmp/txvideo.js
          cp /tmp/txvideo.js txvideo-adblock.js
      - name: Commit only when upstream changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- txvideo-adblock.js; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add txvideo-adblock.js
            git commit -m 'Sync Tencent Video upstream script'
            git push
          fi
