name: 更新航旅纵横去广告模块

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/sync-umetrip-adblock.py"
      - "upstreams/umetrip-ddgksf.conf"
      - ".github/workflows/sync-umetrip-adblock.yml"

permissions:
  contents: write

concurrency:
  group: sync-umetrip-adblock
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下载并校验墨鱼上游
        run: python scripts/sync-umetrip-adblock.py

      - name: 提交有效更新
        run: |
          files=(
            umetrip-adblock.yaml
            umetrip-adblock.js
            upstreams/umetrip-ddgksf.conf
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "上游、模块及同步状态均无变化"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "自动同步航旅纵横去广告模块"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "航旅纵横模块更新已成功推送"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "推送失败（$attempt/3），重新同步后重试"
              sleep $((attempt * 5))
            fi
          done

          echo "连续 3 次推送失败"
          exit 1
