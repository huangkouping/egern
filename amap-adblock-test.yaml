name: 高德地图去广告🅥 (真实抓包对齐版)
description: |-
  基于 HAR 抓包精准适配：接管 m5-x 与 nosgw 域名，切断 home_qs 瀑布流，恢复图标与精简。
  更新时间：2026-11-03 23:02
open_url: https://apps.apple.com/app/id461703208
author: 可莉🅥 & huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Amap.png
dns: {}
rewrites:
- match: (?i)^https://(m5|amap-aos-info-nogw)\.amap\.com/ws/(valueadded|aos)/alimama/splash_screen(_rt)?\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":"1","message":"Successful.","data":{}}'
- match: (?i)^https://ai\.amap\.com/v1/ai_rec/home_qs\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: text/event-stream;charset=UTF-8
      body: "event: data\ndata: {\"is_done\":true,\"component\":{\"type\":\"container\",\"data\":{\"modules\":{}}},\"has_more\":false}\n\nevent: COMPLETE\ndata: {}\n\n"
- match: (?i)^https://(m5|m5-x)\.amap\.com/ws/faas/amap-navigation/main-page-(assets|aiqs)\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5-zb\.amap\.com/ws/promotion-web/resource(/home)?\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://(m5|m5-x)\.amap\.com/ws/info_bff/rankingCard\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://(m5|m5-x)\.amap\.com/ws/smartui/near_recommend\?
  actions:
  - response_body:
      jq: if (try (.data | type == "object") catch false) then del(.data.operation_activity) else . end
- match: (?i)^https://m5-zb\.amap\.com/ws/amap/hitch/passenger/content_info\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://(m5|m5-x)\.amap\.com/ws/shield/dsp/profile/index/nodefaasv3\?
  actions:
  - response_body:
      jq: del(.data.tipData, .data.wallet) | .data.cardList |= map(select(.dataKey == "MineNewFootprintCard" or .dataKey == "MineNewBEntranceCardV4"))
- match: (?i)^https://sns\.amap\.com/ws/opc/tools/list\?
  actions:
  - response_body:
      jq: if (try (.data.category | type == "array") catch false) then (.data.category[] | select(type == "object" and (.tools | type == "array")) | .tools) |= map(select(.id != 547 and .id != "547")) else . end
mitm:
  hostnames:
    includes:
    - m5.amap.com
    - m5-x.amap.com
    - amap-aos-info-nogw.amap.com
    - ai.amap.com
    - m5-zb.amap.com
    - sns.amap.com
    - info.amap.com
