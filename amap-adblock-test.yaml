name: 高德地图去广告🅥
description: |-
  小图标放行，补齐附近推荐合法空游标彻底消除报错，恢复个人中心稳定过滤。
  更新时间：2026-11-03 22:20
open_url: https://apps.apple.com/app/id461703208
author: 可莉🅥 & huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Amap.png
dns: {}
rewrites:
- match: (?i)^https://m5\.amap\.com/ws/valueadded/alimama/splash_screen\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/aos/alimama/splash_screen\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://ai\.amap\.com/v1/ai_rec/home_qs\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5-zb\.amap\.com/ws/promotion-web/resource(/home)?\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/info_bff/rankingCard\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/smartui/near_recommend\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":1,"message":"success","data":{"operation_activity":null,"modules":[],"list":[],"has_more":false,"cursor":""}}'
- match: (?i)^https://m5-zb\.amap\.com/ws/amap/hitch/passenger/content_info\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/shield/dsp/profile/index/nodefaasv3\?
  actions:
  - response_body:
      jq: |-
        if (try (.data | type == "object") catch false) then
          del(.data.tipData, .data.wallet)
          | if (try (.data.cardList | type == "array") catch false) then
              .data.cardList |= map(select(.dataKey == "MineNewFootprintCard" or .dataKey == "MineNewBEntranceCardV4"))
            else . end
        else . end
- match: (?i)^https://sns\.amap\.com/ws/opc/tools/list\?
  actions:
  - response_body:
      jq: |-
        if (try (.data.category | type == "array") catch false) then
          (.data.category[] | select(type == "object" and (.tools | type == "array")) | .tools) |= map(select(.id != 547 and .id != "547"))
        else . end
mitm:
  hostnames:
    includes:
    - m5.amap.com
    - ai.amap.com
    - m5-zb.amap.com
    - sns.amap.com
    - info.amap.com
