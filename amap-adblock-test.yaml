name: 高德地图去广告🅗
description: |-
  精简开屏、首页推荐流、我的页面工具箱、搜索浮层与地点详情页。
  基于 Egern JS 适配器构建，全量补齐界面精简接口，保全核心业务功能。
  更新时间：2026-11-03 21:00
open_url: https://apps.apple.com/app/id461703208
author: huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Amap.png
dns: {}
rewrites:
- match: (?i)^https://m5\.amap\.com/ws/valueadded/alimama/splash_screen\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/aos/alimama/splash_screen\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/faas/amap-navigation/main-page-(assets|aiqs)\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://ai\.amap\.com/v1/ai_rec/home_qs\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5-zb\.amap\.com/ws/promotion-web/resource(/home)?\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/info_bff/rankingCard\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/shield/search_business/process/marketingOperationStructured\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/faas/amap-navigation/card-service-route-plan\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/asa/ads_attribution
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/smartui/near_recommend\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
scriptings:
- http_response:
    name: amap_aocs_clean
    match: (?i)^https://m5\.amap\.com/ws/shield/frogserver/aocs/updatable/1\?
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/scripts/amap-adapter.js
    env:
      MODE: aocs
    body_required: true
    timeout: 5
    update_interval: 86400
- http_response:
    name: amap_poi_detail_clean
    match: (?i)^https://info\.amap\.com/ws/shield/search/poi/detail\?
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/scripts/amap-adapter.js
    env:
      MODE: poi_detail
    body_required: true
    timeout: 5
    update_interval: 86400
- http_response:
    name: amap_profile_clean
    match: (?i)^https://m5\.amap\.com/ws/shield/dsp/profile/index/nodefaasv3\?
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/scripts/amap-adapter.js
    env:
      MODE: profile
    body_required: true
    timeout: 5
    update_interval: 86400
- http_response:
    name: amap_scene_recommend_clean
    match: (?i)^https://m5\.amap\.com/ws/shield/scene/recommend\?
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/scripts/amap-adapter.js
    env:
      MODE: scene_rec
    body_required: true
    timeout: 5
    update_interval: 86400
- http_response:
    name: amap_hitch_passenger_clean
    match: (?i)^https://m5-zb\.amap\.com/ws/amap/hitch/passenger/content_info\?
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/scripts/amap-adapter.js
    env:
      MODE: hitch_passenger
    body_required: true
    timeout: 5
    update_interval: 86400
mitm:
  hostnames:
    includes:
    - m5.amap.com
    - ai.amap.com
    - m5-zb.amap.com
    - info.amap.com
