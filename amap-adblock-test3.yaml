name: 高德地图去广告🅥 (修复版)
description: |-
  首页 AI 流完全放行（双流驱动，外部 Mock 必闪烁），个人中心 JQ 去 IN() 兼容修复，其余精简保持。
  更新时间：2026-11-04 06:47
open_url: https://apps.apple.com/app/id461703208
author: 可莉🅥 & huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Amap.png
dns: {}
rewrites:
- match: (?i)^https://(m5|amap-aos-info-nogw)\.amap\.com/ws/(valueadded|aos)/alimama/splash_screen(_rt)?(\?|$)
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":"1","message":"Successful.","data":{}}'
- match: (?i)^https://(m5|m5-x)\.amap\.com/ws/smartui/near_recommend(\?|$)
  actions:
  - response_body:
      jq: if (try (.data | type == "object") catch false) then del(.data.operation_activity) else . end
- match: (?i)^https://m5-zb\.amap\.com/ws/amap/hitch/passenger/content_info(\?|$)
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://(m5|m5-x)\.amap\.com/ws/shield/dsp/profile/index/nodefaasv3(\?|$)
  actions:
  - response_body:
      jq: |-
        def keep1: . == 7 or . == 8 or . == 10 or . == 17 or . == "7" or . == "8" or . == "10" or . == "17";
        def keep2: . == 32 or . == 4 or . == 9 or . == 16 or . == 14 or . == "32" or . == "4" or . == "9" or . == "16" or . == "14";
        if (try (.data | type == "object") catch false) then
          del(.data.tipData, .data.wallet)
          | if (.data.cardList? | type == "array") then
              .data.cardList |= map(select(.dataKey == "MineNewFootprintCard" or .dataKey == "MineNewBEntranceCardV4"))
              | .data.cardList |= map(
                  if .dataKey == "MineNewBEntranceCardV4" then
                    (if ((.content.entranceList_1 // null) | type == "array") then .content.entranceList_1 |= map(select(.id | keep1)) else . end)
                    | (if ((.content.entranceList_2 // null) | type == "array") then .content.entranceList_2 |= map(select(.id | keep2)) else . end)
                    | (if ((.data.entranceList_1 // null) | type == "array") then .data.entranceList_1 |= map(select(.id | keep1)) else . end)
                    | (if ((.data.entranceList_2 // null) | type == "array") then .data.entranceList_2 |= map(select(.id | keep2)) else . end)
                  else . end
                )
            else . end
          | if (.data.card_list? | type == "array") then
              .data.card_list |= map(select(.dataKey == "MineNewFootprintCard" or .dataKey == "MineNewBEntranceCardV4"))
            else . end
        else . end
- match: (?i)^https://sns\.amap\.com/ws/opc/tools/list(\?|$)
  actions:
  - response_body:
      jq: if (try (.data.category | type == "array") catch false) then (.data.category[] | select(type == "object" and (.tools | type == "array")) | .tools) |= map(select(.id != 547 and .id != "547")) else . end
mitm:
  hostnames:
    includes:
    - m5.amap.com
    - m5-x.amap.com
    - amap-aos-info-nogw.amap.com
    - ai.amap.com
    - m5-zb.amap.com
    - sns.amap.com
    - info.amap.com
