name: 高德地图去广告🅥
description: |-
  小图标原生放行，个人中心精准收敛，附近流安全置空消灭报错。
  更新时间：2026-11-03 22:12
open_url: https://apps.apple.com/app/id461703208
author: 可莉🅥 & huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Amap.png
dns: {}
rewrites:
- match: (?i)^https://m5\.amap\.com/ws/valueadded/alimama/splash_screen\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/aos/alimama/splash_screen\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://ai\.amap\.com/v1/ai_rec/home_qs\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5-zb\.amap\.com/ws/promotion-web/resource(/home)?\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/info_bff/rankingCard\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/smartui/near_recommend\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":1,"message":"success","data":{"operation_activity":null,"modules":[]}}'
- match: (?i)^https://m5-zb\.amap\.com/ws/amap/hitch/passenger/content_info\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/shield/dsp/profile/index/nodefaasv3\?
  actions:
  - response_body:
      jq: del(.data.tipData, .data.wallet) | .data.cardList |= map(select(.dataKey == "MineNewFootprintCard" or .dataKey == "MineNewBEntranceCardV4")) | (.data.cardList[] | select(.dataKey == "MineNewBEntranceCardV4") | (.content // .data) | select(type == "object") | .entranceList_1 | select(type == "array")) |= map(select(.id == 7 or .id == 8 or .id == 10 or .id == 17 or .id == "7" or .id == "8" or .id == "10" or .id == "17")) | (.data.cardList[] | select(.dataKey == "MineNewBEntranceCardV4") | (.content // .data) | select(type == "object") | .entranceList_2 | select(type == "array")) |= map(select(.id == 32 or .id == 4 or .id == 9 or .id == 16 or .id == 14 or .id == "32" or .id == "4" or .id == "9" or .id == "16" or .id == "14"))
- match: (?i)^https://sns\.amap\.com/ws/opc/tools/list\?
  actions:
  - response_body:
      jq: if (try (.data.category | type == "array") catch false) then (.data.category[] | select(type == "object" and (.tools | type == "array")) | .tools) |= map(select(.id != 547 and .id != "547")) else . end
mitm:
  hostnames:
    includes:
    - m5.amap.com
    - ai.amap.com
    - m5-zb.amap.com
    - sns.amap.com
    - info.amap.com
