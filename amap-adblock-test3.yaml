      body: '{}'
- match: (?i)^https://m5-zb\.amap\.com/ws/amap/hitch/passenger/content_info\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/shield/dsp/profile/index/nodefaasv3\?
  actions:
  - response_body:
      jq: del(.data.tipData, .data.wallet) | .data.cardList |= map(select(.dataKey == "MineNewFootprintCard" or .dataKey == "MineNewBEntranceCardV4"))
- match: (?i)^https://sns\.amap\.com/ws/opc/tools/list\?
  actions:
  - response_body:
      jq: if (try (.data.category | type == "array") catch false) then (.data.category[] | select(type == "object" and (.tools | type == "array")) | .tools) |= map(select(.id != 547 and .id != "547")) else . end
mitm:
  hostnames:
    includes:
    - m5.amap.com
    - ai.amap.com
    - m5-zb.amap.com
    - sns.amap.com
    - info.amap.com
