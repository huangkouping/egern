compat_arguments_desc: "仅适用于百度 HTML 搜索结果页。请开启 MitM 并信任证书。若百度使用动态分页或不同页面结构，保留原生分页，不强制加载。"
scriptings:
- http_response:
    name: 百度搜索自动翻页
    match: ^https?://(m|www)\.baidu\.com/s\?
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-mobile-autopage.js?v=20261101b
