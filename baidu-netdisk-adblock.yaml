name: 百度网盘去广告🅥
description: |-
  |-
  去除广告及弹窗，精简首页入口。
  更新时间：2026-11-01 13:52
open_url: https://apps.apple.com/app/id547166701
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BaiduNetDisk.png

# 基于用户提供的完整配置备份，保留原处理逻辑。
# 手动维护，未配置上游定时同步。
# 2026-11-01 嫁接 ddgksf2013 百度网盘去广告 V1.0.5：新增 8 条纯拦截（会员引导弹窗、
# 设置信息流、pcs/ad、热搜、搜索填词、金币乐园、短剧推荐、章鱼移动广告 SDK），
# 及 3 条脚本规则（afd 广告入口、游戏中心、首页信息流），脚本镜像保存在本仓库
# baidu-netdisk-adblock.js（上游为混淆构建、不可审计，用户已确认接受）。
dns: {}
rewrites:
  - match: "(?i)^https://pan\\.baidu\\.com/api/getconfig\\?"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://pan\\.baidu\\.com/api/getsyscfg\\?"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://pan\\.baidu\\.com/api/taskscore/tasklist\\?"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://pan\\.baidu\\.com/act/api/activityentry\\?"
