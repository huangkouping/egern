scriptings:
  - http_response:
      name: 百度网盘广告推广净化
      match: '(?i)^https://afd\.baidu\.com/afd/entry'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-netdisk-adblock.js?v=bae209c736fb
      body_required: true
      timeout: 20
  - http_response:
      name: 百度网盘游戏中心净化
      match: '(?i)^https://pan\.baidu\.com/rest/.*/membership/user\?method=gamecenter'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-netdisk-adblock.js?v=bae209c736fb
      body_required: true
      timeout: 20
  - http_response:
      name: 百度网盘首页信息流净化
      match: '(?i)^https://pan\.baidu\.com/feed/cardinfos'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-netdisk-adblock.js?v=bae209c736fb
      body_required: true
      timeout: 20
mitm:
  hostnames:
    includes:
      - pan.baidu.com
      - afd.baidu.com
      - zhangyuyidong.cn
