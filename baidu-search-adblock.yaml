name: 搜索去广告🅗
description: |-
  去除百度、Bing、Google 搜索广告。
  更新时间：2026-11-26 23:25
author: limbopro[https://github.com/limbopro/Adblock4limbo], huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Baidu.png
compat_arguments_desc: 请启用 MitM 并信任证书。
dns: {}
scriptings:
- http_response:
    name: 百度知道去广告
    match: ^https?://(zhidao)\.baidu\.com/(question|index|\?fr|\?word)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-search-adblock.js?v=1dee7fe2812d
    body_required: true
    timeout: 20
- http_response:
    name: 百度搜索首页去广告
    match: https?://(www|m)\.baidu\.com(/$|/\?ref.*)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-search-adblock.js?v=1dee7fe2812d
    body_required: true
    timeout: 20
- http_response:
    name: 百度搜索结果去广告
    match: https?://(www|m)\.baidu\.com/(from=|s\?)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-search-adblock.js?v=1dee7fe2812d
    body_required: true
    max_size: 8388608
    timeout: 20
- http_response:
    name: 必应搜索去广告
    match: ^https?://(www|cn)\.bing\.com/search\?
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-search-adblock.js?v=1dee7fe2812d
    body_required: true
    timeout: 20
- http_response:
    name: 谷歌搜索去广告
    match: ^https?://www\.google\.com(\.hk|\.tw)?/search
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/baidu-search-adblock.js?v=1dee7fe2812d
    body_required: true
    timeout: 20
url_rewrites:
- match: (?i)^https?://[^/]+/Adguard/Adblock4limbo\.function\.js
  location: http://reject-dict/
- match: ^https?://(www\.)?(g|google)\.cn(/.*)?$
  location: https://www.google.com$3
  status_code: 302
mitm:
  hostnames:
    includes:
    - www.baidu.com
    - m.baidu.com
    - zhidao.baidu.com
    - www.bing.com
    - cn.bing.com
    - www.google.com
    - www.google.com.hk
    - www.google.com.tw
    - google.cn
    - www.google.cn
    - g.cn
    - www.g.cn
    - limbopro.com
