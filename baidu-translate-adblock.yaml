name: 百度翻译去广告©️
description: |-
  去除开屏、横幅广告，精简我的页面。
  更新时间：2026-10-31 21:12
open_url: https://apps.apple.com/app/id605670941
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/BaiduTranslate.png

# 基于用户提供的完整配置备份，保留原处理逻辑。
# 无远程 JS/jq 依赖；手动维护，未配置上游定时同步。
dns: {}
rewrites:
  - match: '(?i)^https://fanyi-app\.baidu\.com/transapp/v2/api/launch/config\?'
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: '(?i)^https://fanyi-app\.baidu\.com/transapp/comment/my\?'
    actions:
      - response_body:
          jq: 'delpaths([["data","taskBanner"],["data","act"]])'
  - match: '(?i)^https://fanyi-app\.baidu\.com/transapp/recitewd/myplan\?'
    actions:
      - response_body:
          jq: 'delpaths([["data","activityRec"],["data","activityRecList"]])'
  - match: '(?i)^https://fanyi-app\.baidu\.com/static/react-activity/page/courseBoutique\.html\?'
    actions:
      - respond:
          status: 404
mitm:
  hostnames:
    includes:
      - fanyi-app.baidu.com
