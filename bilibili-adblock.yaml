name: 哔哩哔哩去广告🅥
description: |-
  过滤广告、精简页面，保留可选空降助手等原功能。
  同步状态：全部JS及jq镜像同步正常；最近检查：2026-11-14 04:01
  更新时间：2026-11-14 04:01
open_url: https://apps.apple.com/app/id736536022
author: kokoryh[https://github.com/kokoryh], huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Bilibili.png
compat_arguments:
  SPONSOR_POLICY: DIRECT
compat_arguments_desc: 使用说明：启用HTTPS解密并信任证书，需可解密HTTP/2/gRPC。保留原模块去广告、页面整理、交互弹幕、链接跟踪处理及附带显示/播放配置功能。5个环境开关沿用原默认值。空降助手默认关闭；开启后依赖第三方bsbsb.top及kokoryh/chronos公开资源，准确性和可用性以第三方为准。SPONSOR_POLICY默认DIRECT，可改为主配置实际存在的代理策略组名称以对应Loon的PROXY策略。所有JS备份并原生适配，2个jq内联，每6小时校验同步公开镜像；失败保留完整有效版本。当前客户端完整效果需实机验证。
env_schema:
  displayUpList:
    name: 动态最常访问列表
    default_value: show
    options:
    - show
    - hide
    - auto
  purifyComment:
    name: 移除评论区置顶广告
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  optimizeRequest:
    name: 优化评论区加载异常
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  sponsorBlock:
    name: 空降助手
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  logLevel:
    name: 日志等级
    default_value: 'off'
    options:
    - 'off'
    - error
    - warn
    - info
    - debug
dns: {}
rules:
- domain:
    match: bsbsb.top
    policy: '{{{SPONSOR_POLICY}}}'
- domain:
    match: api.biliapi.com
    policy: REJECT
- domain:
    match: app.biliapi.com
    policy: REJECT
- domain:
    match: api.biliapi.net
    policy: REJECT
- domain:
    match: app.biliapi.net
    policy: REJECT
- and:
    match:
    - domain_suffix:
        match: chat.bilibili.com
    - or:
        match:
        - domain_keyword:
            match: stun
        - domain_keyword:
            match: tracker
        - domain_keyword:
            match: p2p
    policy: REJECT
rewrites:
- match: (?i)^https://api\.bilibili\.com/x/pd-proxy/tracker\?
  actions:
  - response_body:
      jq: .data[][]?="stun.chat.bilibili.com:3478"
- match: (?i)^https://app\.bilibili\.com/x/v2/splash/(show|event/list2)\?
  actions:
  - response_body:
      jq: .data |= with_entries(if .key | IN("show", "event_list") then .value = [] else . end)
- match: (?i)^https://app\.bilibili\.com/x/v2/splash/list\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":0,"message":"OK","ttl":1,"data":{"max_time":0,"min_interval":31536000,"pull_interval":31536000,"keep_ids":[],"show":[],"list":[{}],"splash_request_id":""}}'
- match: (?i)^https://app\.bilibili\.com/x/resource/show/tab/v2\?
  actions:
  - response_body:
      jq: ".data.tab = [\n    {\n        pos: 1,\n        id: 477,\n        name: \"推荐\",\n        tab_id: \"推荐tab\",\n        uri: \"bilibili://pegasus/promo\",\n        default_selected: 1\n    },\n    {\n        pos: 2,\n        id: 478,\n        name: \"热门\",\n        tab_id: \"热门tab\",\n        uri: \"bilibili://pegasus/hottopic\"\n    },\n    {\n        pos: 3,\n        id: 545,\n        name: \"动画\",\n        tab_id: \"bangumi\",\n        uri: \"bilibili://pgc/home\"\n    },\n    {\n        pos: 4,\n        id: 151,\n        name: \"影视\",\n        tab_id: \"film\",\n        uri: \"bilibili://pgc/cinema-tab\"\n    },\n    {\n        pos: 5,\n        id: 731,\n        name: \"直播\",\n        tab_id: \"直播tab\",\n        uri: \"bilibili://live/home\"\n    }\n] | \n.data.top = [\n    {\n        pos: 1,\n        id: 176,\n        name: \"消息\",\n        tab_id: \"消息Top\",\n        uri: \"bilibili://link/im_home\",\n        icon: \"http://i0.hdslb.com/bfs/archive/d43047538e72c9ed8fd8e4e34415fbe3a4f632cb.png\"\
        \n    }\n] | \n.data.bottom = [\n    {\n        pos: 1,\n        id: 177,\n        name: \"首页\",\n        tab_id: \"home\",\n        uri: \"bilibili://main/home/\",\n        icon: \"http://i0.hdslb.com/bfs/archive/63d7ee88d471786c1af45af86e8cb7f607edf91b.png\",\n        icon_selected: \"http://i0.hdslb.com/bfs/archive/e5106aa688dc729e7f0eafcbb80317feb54a43bd.png\"\n    },\n    {\n        pos: 2,\n        id: 179,\n        name: \"动态\",\n        tab_id: \"dynamic\",\n        uri: \"bilibili://following/home/\",\n        icon: \"http://i0.hdslb.com/bfs/archive/86dfbe5fa32f11a8588b9ae0fccb77d3c27cedf6.png\",\n        icon_selected: \"http://i0.hdslb.com/bfs/archive/25b658e1f6b6da57eecba328556101dbdcb4b53f.png\"\n    },\n    {\n        pos: 5,\n        id: 181,\n        name: \"我的\",\n        tab_id: \"我的Bottom\",\n        uri: \"bilibili://user_center/\",\n        icon: \"http://i0.hdslb.com/bfs/archive/4b0b2c49ffeb4f0c2e6a4cceebeef0aab1c53fe1.png\",\n        icon_selected: \"http://i0.hdslb.com/bfs/archive/a54a8009116cb896e64ef14dcf50e5cade401e00.png\"\
        \n    }\n]\n\n"
- match: (?i)^https://app\.bilibili\.com/x/v2/feed/index\?
  actions:
  - response_body:
      jq: if .data.items then .data.items |= map(select((.banner_item == null) and (.ad_info == null) and (.card_goto == "av") and (.card_type | IN("small_cover_v2", "large_cover_single_v9", "large_cover_v1")))) end
- match: (?i)^https://api\.bilibili\.com/pgc/activity/deliver/material/receive\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
- match: (?i)^https://api\.bilibili\.com/pgc/view/v2/app/season\?
  actions:
  - response_body:
      jq: del(.data.payment)
- match: (?i)^https://api\.bilibili\.com/pgc/page/channel\?
  actions:
  - response_body:
      jq: .data.modules |= map(select(.type != "TIP") | if .type == "BANNER" then .module_data.items |= map(select(.url | startswith("https://www.bilibili.com/blackboard/era/") | not)) else . end)
- match: (?i)^https://app\.bilibili\.com/x/v2/feed/index/story\?
  actions:
  - response_body:
      jq: if .data.items then .data.items |= map(select((.ad_info == null) and (.card_goto | IN("vertical_ad_av", "vertical_ad_live", "vertical_ad_picture") | not)) | del(.story_cart_icon, .free_flow_toast, .image_infos, .course_info, .game_info)) end
- match: (?i)^https://ap[ip]\.bilibili\.com/x/(resource/(top/activity|patch/tab(/v2)?)|v2/search/square|vip/ads/materials)\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{"code":-404,"message":"-404","ttl":1,"data":null}'
- match: (?i)^https://line3-h5-mobile-api\.biligame\.com/game/live/large_card_material\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://api\.live\.bilibili\.com/xlive/e-commerce-interface/v1/ecommerce-user/get_shopping_info\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://api\.live\.bilibili\.com/xlive/open-interface/v2/tracker/conf\?
  actions:
  - response_body:
      jq: .data.domains=["wss://tracker.chat.bilibili.com"]
- match: (?i)^https://app\.bilibili\.com/x/resource/show/skin\?
  actions:
  - response_body:
      jq: delpaths([["data", "common_equip"]])
