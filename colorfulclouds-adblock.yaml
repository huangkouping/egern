name: 彩云天气去广告🅥
author: RuCu6[https://github.com/RuCu6]
homepage: https://github.com/huangkouping/egern
open_url: https://apps.apple.com/app/id847764912
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ColorfulClouds.png
compat_arguments_desc: '【使用说明】

  启用模块，确认 MitM 已开启且证书受信任，然后重新打开彩云天气。

  关闭其他彩云去广告模块，避免重复处理。

  JS 已备份到本仓库，每 6 小时检查可莉官方脚本；失败时保留上次有效版本。

  原规则为用户提供的可莉配置，JS 直连可莉官方分发（Moli-X/Tool），标注版本 2024-09-05；活动推广处理逻辑源自 RuCu6。不采用 RuCu6 原版：原版是会员破解脚本，会注入他人账号 token 并伪造 SVIP，与去广告无关且有安全风险。

  保留源处理逻辑，仅增加异常透传；当前 App 效果待实测。'
dns: {}
rules:
- domain:
    match: abyss.cyapi.cn
    policy: REJECT
- domain:
    match: ad.cyapi.cn
    policy: REJECT
- domain:
    match: gather.colorfulclouds.net
    policy: REJECT
- domain:
    match: log.caiyunapp.com
    policy: REJECT
- domain:
    match: adx.caiyunapp.com
    policy: REJECT
rewrites:
- match: '(?i)^https://biz\.cyapi\.cn/(p/v1/entries|p/v1/trial_card/info|v2/product)'
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: '(?i)^https://starplucker\.cyapi\.cn/v3/(config/cypage/\w+/conditions|notification/message_center|operation/homefeatures)'
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
scriptings:
- http_response:
    name: 彩云天气去广告
    match: '(?i)^https://(wrapper\\.cyapi\\.cn|api\\.caiyunapp\\.com|cdn-w\\.caiyunapp\\.com)/v1/activity\\?'
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/colorfulclouds-adblock.js?v=a016f7331a4c
    body_required: true
    timeout: 10
    update_interval: 3600
mitm:
  hostnames:
    includes:
    - biz.cyapi.cn
    - starplucker.cyapi.cn
    - wrapper.cyapi.cn
    - api.caiyunapp.com
    - cdn-w.caiyunapp.com
description: '更新时间：2026-11-02 23:40

  过滤首页推广、弹窗及部分页面广告。

  同步状态：官方脚本同步正常；最近检查：2026-11-02 23:40'
