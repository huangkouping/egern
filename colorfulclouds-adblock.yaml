name: 彩云天气去广告🅥
author: RuCu6[https://github.com/RuCu6]
homepage: https://github.com/huangkouping/egern
open_url: https://apps.apple.com/app/id847764912
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/ColorfulClouds.png
compat_arguments_desc: '【使用说明】

  启用模块，确认 MitM 已开启且证书受信任，然后重新打开彩云天气。

  关闭其他彩云去广告模块，避免重复处理。

  JS 已备份到本仓库，每 6 小时检查公开镜像；失败时保留上次有效版本。

  原规则为用户提供的可莉配置，JS 来自 ifflagged/Romeo 公开镜像，标注版本 2024-09-05。

  保留源处理逻辑，仅增加异常透传；不保证与可莉服务器现版一致，当前 App 效果待实测。'
dns: {}
rules:
- domain:
    match: abyss.cyapi.cn
    policy: REJECT
- domain:
    match: ad.cyapi.cn
    policy: REJECT
- domain:
    match: gather.colorfulclouds.net
    policy: REJECT
rewrites:
- match: (?i)^https://biz\.cyapi\.cn/(p/v1/entries|p/v1/trial_card/info|v2/product)
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://starplucker\.cyapi\.cn/v3/(config/cypage/\w+/conditions|notification/message_center|operation/homefeatures)
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- name: 彩云天气去广告
  match: (?i)^https://(wrapper\.cyapi\.cn|api\.caiyunapp\.com|cdn-w\.caiyunapp\.com)/v1/activity\?
  actions:
  - response_script:
      name: 彩云天气去广告
      url: https://raw.githubusercontent.com/huangkouping/egern/main/colorfulclouds-adblock.js?v=a2043fb4e7d4
      timeout: 20
      body_required: true
mitm:
  hostnames:
    includes:
    - biz.cyapi.cn
    - starplucker.cyapi.cn
    - wrapper.cyapi.cn
    - api.caiyunapp.com
    - cdn-w.caiyunapp.com
description: '更新时间：2026-11-01 07:29

  过滤首页推广、弹窗及部分页面广告。

  同步状态：脚本镜像同步正常；最近检查：2026-11-01 07:51'
