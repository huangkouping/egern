name: 滴滴去广告🅥
description: |-
  去除开屏、弹窗及推广，精简我的页面。
  更新时间：2026-10-31 21:16
open_url: https://apps.apple.com/app/id554499054
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DiDi.png

# 基于用户提供的完整配置备份，合并 fast、dache_homepage_layout 与 mget 重复匹配。
# 无远程 JavaScript 依赖；手动维护，未配置上游定时同步。
dns: {}
rules:
  - domain:
      match: gwp.xiaojukeji.com
      policy: REJECT
  - domain:
      match: gwpgz.diditaxi.com.cn
      policy: REJECT
  - domain:
      match: adtrack.xiaojukeji.com
      policy: REJECT
rewrites:
  - match: "(?i)^https://as\\.xiaojukeji\\.com/ep/as/toggles\\?"
    actions:
      - response_body:
          jq: ".data |= map(select(.name != \"isUseNetConnectivity\") | .assign.args.rootca_pin = 0 | .assign.args.sni_list = {})"
  - match: "(?i)^https://conf\\.diditaxi\\.com\\.cn/homepage/v\\d/other/slow\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"order_cards\",\"new_loss_banner_card\"],[\"data\",\"order_cards\",\"call_car_card_80\"]])"
  - match: "(?i)^https://conf\\.diditaxi\\.com\\.cn/homepage/v\\d/core\\?"
    actions:
      - response_body:
          jq: ".data.order_cards.nav_list_card.data |= map(select(.nav_id == \"dache_anycar\" or .nav_id == \"carmate\" or .nav_id == \"driverservice\" or .nav_id == \"zhandianbashi\" or .nav_id == \"pincheche\" or .nav_id == \"bike\" or .nav_id == \"nav_more_v3\")) | .data.disorder_cards.top_nav_list.data.top_nav_info |= map(select(.nav_id == \"chu_xing\" or .nav_id == \"freight_cargo\"))"
  - match: "(?i)^https://conf\\.diditaxi\\.com\\.cn/homepage/v\\d/other/fast\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"disorder_cards\",\"communicate_card\"],[\"data\",\"disorder_cards\",\"not_login_bottom_bar\"],[\"data\",\"disorder_cards\",\"riding_code_card\"],[\"data\",\"order_cards\"],[\"data\",\"disorder_cards\",\"car_icon\",\"data\",\"icon_info_new_agreement\"],[\"data\",\"disorder_cards\",\"guess_card\"],[\"data\",\"disorder_cards\",\"scene_list_card\"]])"
  - match: "(?i)^https://common\\.diditaxi\\.com\\.cn/common/v\\d/usercenter/layout"
    actions:
      - response_body:
          jq: ".data |= (.instances |= (to_entries | map(select(.key as $k | [\"center_base_info_card\", \"center_tool_card\", \"center_wallet_finance_card\", \"center_order_related_card\"] | index($k))) | from_entries)) | .data.instances.center_wallet_finance_card.data.view_info |= map(select(.title == \"优惠卡券\"))"
  - match: "(?i)^https://res\\.xiaojukeji\\.com/resapi/activity/mget(?:\\?|$)"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://api\\.udache\\.com/gulfstream/porsche/v\\d/dache_homepage_layout\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"instances\",\"dache_main_core_icon\"]]) | .data |= (.instances |= (to_entries | map(select(.key | test(\"feed_back_|dache_main_member|order_container_|dache_main_core_icon|dache_main_card_\"))) | from_entries))"
  - match: "(?i)^https://api\\.udache\\.com/intercity/ticket/api/v\\d/core/getFullPageInfoLayout\\?"
    actions:
      - response_body:
          jq: ".data.disorder_components |= (map(select(.name == \"history_order_card\" or .name == \"inprogress_order_card\" or .name == \"station_calendar\" or .name == \"main_card_v2\" or .name == \"user_history_order\")))"
  - match: "(?i)^https://daijia\\.kuaidadi\\.com(:443)?/gateway\\?api=prado\\.cms\\.delivery\\.batch"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://daijia\\.kuaidadi\\.com(:443)?/gateway\\?api=prado\\.cms\\.AggregateDeliveryRemoteService\\.aggregateDelivery"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://daijia\\.kuaidadi\\.com(:443)?/gateway\\?api=lj\\.cos\\.apolloConfig"
    actions:
      - response_body:
          jq: ".data |= map(select(.name != \"daijia-memberInfo-config\" and .name != \"daijia-transfer-share-config\"))"
  - match: "(?i)^https://daijia\\.kuaidadi\\.com(:443)?/gateway\\?api=lj\\.c\\.p\\.queryLevelAndRightsStatus"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://daijia\\.kuaidadi\\.com(:443)?/gateway\\?api=lj\\.cos\\.p\\.popup"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://daijia\\.kuaidadi\\.com(:443)?/gateway\\?api=lj\\.cos\\.apolloToggle"
    actions:
      - response_body:
          jq: ".data |= map(select(.name as $n | {daijia_app_estimate_pre_req_switch:true,daijia_agent_car_picture_check:true,daijia_bluetooth_wifi_degrade_switch:true,daijia_weixin_publish_login:true,daijia_estimate_recommend_degrade_switch:true,daijia_yugu_policy_switch:true,daijia_home_location_guide_switch:true,daijia_estimate_switch:true} | has($n)))"
  - match: "(?i)^https://api\\.udache\\.com/gulfstream/porsche/v\\d/bronze/pinchengle_homepage_layout$"
    actions:
      - response_body:
          jq: ".data.instances |= with_entries(select(.key | IN(\"dacheanycar-certificates-1\", \"main-card-1\", \"map-1\", \"nav-1\", \"tool-container-1\")))"
  - match: "(?i)^https://api\\.udache\\.com/gulfstream/porsche/v\\d/pSFCHomePage\\?"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://api\\.udache\\.com/gulfstream/porsche/v\\d/SFCHomeTab\\?"
    actions:
      - response_body:
          jq: ".data.tab_list |= map(select(.tab_id == \"passenger\" or .tab_id == \"driver\"))"
  - match: "(?i)^https://htwkop-st\\.xiaojukeji\\.com/gateway\\?api=cms\\.htw\\.delivery\\.batch"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://htwkop\\.xiaojukeji\\.com(:443)?/gateway\\?api=hm\\.fa\\.querySellCardSummary"
    actions:
      - response_body:
          jq: "setpath([\"data\"]; \"{}\")"
  - match: "(?i)^https://htwkop\\.xiaojukeji\\.com(:443)?/gateway\\?api=hm\\.fa\\.queryWelfareCenter"
    actions:
      - response_body:
          jq: "setpath([\"data\"]; \"{}\")"
  - match: "(?i)^https://freight\\.xiaojukeji\\.com/gateway\\?api=freight\\.d\\.core\\.multiDisplayV\\d"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: "(?i)^https://poi\\.map\\.xiaojukeji\\.com/mapapi/startinfo\\?api_version"
    actions:
      - response_body:
          jq: "delpaths([[\"rec_destination\"]])"
  - match: "(?i)^https://poi\\.map\\.xiaojukeji\\.com/mapapi/poiinfo\\?product_id"
    actions:
      - response_body:
          jq: "delpaths([[\"rec_destination\"]])"
  - match: "(?i)^https://common\\.diditaxi\\.com\\.cn/user_common/itineraryList\\?"
    actions:
      - response_body:
          jq: "del(.data.tab_nav[]?.tab_param)"
mitm:
  hostnames:
    includes:
      - as.xiaojukeji.com
      - conf.diditaxi.com.cn
      - common.diditaxi.com.cn
      - res.xiaojukeji.com
      - api.udache.com
      - daijia.kuaidadi.com
      - htwkop-st.xiaojukeji.com
      - htwkop.xiaojukeji.com
      - freight.xiaojukeji.com
      - poi.map.xiaojukeji.com
