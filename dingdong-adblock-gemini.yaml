name: 叮咚买菜去广告完美版🅗
description: |-
  完美适配叮咚买菜去广告，去除底部Ai菜单，精简我的页面。
  更新时间：2026-11-02 11:14
open_url: https://apps.apple.com/app/id768082524
author: huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DingdongMaicai.png

dns: {}

rules:
  - domain:
      match: trackercollect.ddxq.mobi
      policy: REJECT
  - domain:
      match: ddfs-public.ddimg.mobi
      policy: REJECT
  - domain:
      match: rttrack.ddxq.mobi
      policy: REJECT

rewrites:
  - match: "(?i)^https?://119\\.29\\.29\\.\\d+/d"
    actions:
      - respond:
          status: 200

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/advert/"
    actions:
      - respond:
          status: 404

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/getHomeAdPop"
    actions:
      - respond:
          status: 404

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/vip/getVipAd(/|\\?|$)"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/marketingNotice(/|\\?|$)"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/search/(rollHotKeyword|rankingList|hotKeyword)(/|\\?|$)"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/order/getRecommend$"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/userLike(/|\\?|$)"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/guide-service/userLike/flowData$"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/floatingEntry"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://user\\.api\\.ddxq\\.mobi/userportal-service/api/v1/user/queryMyPage(/|\\?|$)"
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{"code":0,"data":{}}'

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/categoriesNewDetail(/|\\?|$)"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"ad_info\"]])"

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/tool/getConfig(/|\\?|$)"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"ai_enter_config\"]])"

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/newDetails(/|\\?|$)"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"top_advert_data\"],[\"data\",\"suspension\"]]) | if .data.list? then .data.list |= map(select(has(\"capsule_freedom_zone\") | not)) else . end"

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/guide-service/productApi/productDetail/info(/|\\?|$)"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"detail\",\"chatEntry\"]])"

  # 底部导航栏：确保保留四大基础功能，仅删掉 AI/菜谱 和中置凸起按钮
  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/bottomNavi"
    actions:
      - response_body:
          jq: >-
            del(.data.adId?, .data.middle_button?, .data.center_icon?, .data.floating_layer?) |
            if (.data.bottom_list? | length > 0) then
              .data.bottom_list |= map(select(
                ((.name // "") | test("首页|分类|购物车|我的|Home|Category|Cart|Mine")) or
                (
                  (.type != "eatwhat") and
                  ((.type // "" | ascii_downcase | test("ai|recipe|chat") | not)) and
                  ((.name // "" | test("AI|助手|做饭|菜谱|吃什么") | not))
                )
              ))
            else . end

  - match: "(?i)^https?://maicai\\.api\\.ddxq\\.mobi/homeApi/homeFlowDetail"
    actions:
      - response_body:
          jq: "walk(if type == \"object\" and has(\"list\") then .list |= map(if type == \"object\" and has(\"multi_advertise_data_list\") then del(.multi_advertise_data_list) else . end) else . end)"

mitm:
  hostnames:
    includes:
      - '119.29.29.*'
      - maicai.api.ddxq.mobi
      - user.api.ddxq.mobi
