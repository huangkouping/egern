name: 闲鱼去广告🅗
description: |-
  去除开屏广告及首页、搜索和我的页面推广内容。
  更新时间：2026-11-10 09:12
open_url: https://apps.apple.com/app/id510909506
author: huangkouping
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/FleaMarket.png

# 基于用户提供的完整配置备份，合并两条搜索接口响应处理。
# 无远程 JS/jq 依赖；手动维护，未配置上游定时同步。
# 2026-11-01 嫁接墨鱼 GoofishAds 独有两条：mtop.idle.ad.expose 通用广告接口拦截、iyes.youku.com 广告域名 reject。
dns: {}
rewrites:
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlecommerce\\.splash\\.ads/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{\"api\":\"mtop.taobao.idlecommerce.splash.ads\",\"data\":{\"adMap\":{},\"cacheAd\":\"\",\"cacheAdInfo\":{},\"dspList\":[],\"hotStartInterval\":\"0\"},\"ret\":[\"SUCCESS::调用成功\"],\"v\":\"2.0\"}"
  - match: "(?i)^https://(?:g-)?acs\\.m\\.goofish\\.com/gw/mtop\\.idle\\.ad\\.expose/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlehome\\.home\\.nextfresh/"
    actions:
      - response_body:
          jq: ".data.homeTopList |= map(select(.sectionType == \"kingkongDo\")) | .data.sections |= map(select(.data.clickParam.args.cardType as $ct | $ct != \"homeMultiBanner\" and $ct != \"mamaAD\")) | .data.sections |= map(select((.template.name|type==\"string\")and(.template.name==\"idlefish_home_new_commodity_card\"or(.template.name|contains(\"fish_home_tags_item_card\")))))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlehome\\.widget\\.refresh\\.get/"
    actions:
      - response_body:
          jq: ".data.homeTopList |= map(select(.sectionType == \"kingkongDo\"))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.home\\.whale\\.modulet/"
    actions:
      - response_body:
          jq: ".data.container.sections |= map(select(.template.name == \"fish_home_miniapp\"))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.user\\.strategy\\.list/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.fun\\.follow\\.feed\\.list/"
    actions:
      - response_body:
          jq: ".data.sections|=map(select(.cardType==2001))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlehome\\.home\\.community/"
    actions:
      - response_body:
          jq: ".data.feedsList |= map(select(.template.name == \"idlefish_home_new_commodity_card\" or .template.name == \"idlefish_home_new_content_card\"))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.item\\.recommend\\.list/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlehome\\.home\\.newitem\\.page/"
    actions:
      - response_body:
          jq: ".data.sections |= map(select(.data.clickParam.args.cardType as $ct | $ct != \"banner\" and $ct != \"mamaAD\"))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.local\\.near\\.by\\.corner\\.info/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.local\\.flow\\.plat\\.section/"
    actions:
      - response_body:
          jq: ".data.data.components |= map(select(.data and (.data|type==\"object\") and .data.template and (.data.template|type==\"object\") and .data.template.name and (.data.template.name|type==\"string\") and (.data.template.name|contains(\"fish_city_kingkong\"))))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.local\\.home\\.top/"
    actions:
      - response_body:
          jq: ".data.data.components |= map(select(.key == \"fish_home_second_stage_top_cardV3\"))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.local\\.home/"
    actions:
      - response_body:
          jq: ".data.sections |= map(select((.template.cardEnum != \"ads\") and (.cardType == \"common\")))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.idle\\.user\\.page\\.my\\.adapter/"
    actions:
      - response_body:
          jq: ".data.container.sections |= map(select((.template.name? // \"\") | test(\"^my_fy[0-9]+_(header|user_info|trade|appraise|tools)$\"))) | .data.container.sections |= map(.item |= (if .level and .level.exContent and (.level.exContent | has(\"tips\")) then del(.level) else . end)) | .data.container.sections |= map(if .sectionBizCode==\"entry2025\" then .item.tool.exContent.tools |= [[.[][] | select(.exContent.id as $id | $id==5 or $id==39 or $id==6 or $id==30 or $id==29 or $id==2 or $id==32 or $id==3 or $id==1)] | sort_by(. as $item | ([5,39,6,30,29,2,32,3,1] | index($item.exContent.id))) | [range(0;length;5) as $i | .[$i:$i+5]]][] else . end) | del(.data.ability)"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.item\\.buy\\.feeds/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlemtopsearch\\.search\\.shade/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlehome\\.home\\.circle\\.list/"
    actions:
      - response_body:
          jq: ".data.circleList[]?.showInfo |= del(.titleImage, .atmosphereImageUrl) | .data.next.headList |= map(select(.bizCode == \"main\" or .bizCode == \"market\" or .bizCode == \"IDLE_CIRCLE\")) | del(.data.next.headList[]?.showInfo.rightTagImage)"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlehome\\.magic\\.home\\.page\\.list/"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"topList\"]])"
  - match: "(?i)^https://g-acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlemtopsearch\\.search/"
    actions:
      - response_body:
          jq: ".data.resultList |= map(if .data.item.main.exContent.dislikeFeedback.clickParam.args.bizType == \"ad\" then empty else . end) | delpaths([[\"data\",\"resultPrefixBar\"]])"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlemtopsearch\\.search\\.discover/"
    actions:
      - response_body:
          jq: ".data.resultList |= map(select(.type != \"MarketHotSpot\"))"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idlemtopsearch\\.item\\.search\\.activate/"
    actions:
      - response_body:
          jq: ".data.cardList |= map(if has(\"cardData\") and (.cardData | has(\"hotwords\")) then .cardData |= del(.hotwords) else . end)"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.playboy\\.recommend/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://acs\\.m\\.goofish\\.com/gw/mtop\\.taobao\\.idle\\.trade\\.full\\.info/"
    actions:
      - response_body:
          jq: ".data.components |= map(select(.render | . == \"orderStatusVO\" or . == \"addressInfoVO\" or . == \"orderInfoVO\"))"
url_rewrites:
  - match: "(?i)^https?://(?:[a-z0-9-]+\\.)*iyes\\.youku\\.com(?:[:/]|$)"
    location: http://reject-dict/

mitm:
  hostnames:
    includes:
      - acs.m.goofish.com
      - g-acs.m.goofish.com
      - iyes.youku.com
      - '*.iyes.youku.com'
