name: 盒马去广告🅥（测试版）
description: |-
  去除开屏、广告及购物推荐，精简底栏、购物车及我的页面瀑布流。
  更新时间：2026-11-02 11:32
open_url: https://apps.apple.com/app/id1063183999
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MrHema.png

dns: {}

rewrites:
  # ---------------- 1. 开屏启动页与弹窗广告拦截 ----------------
  # 阿里开屏广告拉取 & 盒马启动全屏页接口
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/(mtop\\.alimm\\.munion\\.render\\.openad\\.get|mtop\\.wdk\\.render\\.querywelcomepage)/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"api":"","data":{},"ret":["SUCCESS::接口调用成功"]}'

  # 内部浮层与弹窗活动置空
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/(mtop\\.wdk\\.sg\\.queryinnerpage|mtop\\.wdk\\.sg\\.querysinglescene)/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"api":"","data":{},"ret":["SUCCESS::接口调用成功"]}'

  # ---------------- 2. 购物车与“我的”页面瀑布流推荐拦截 ----------------
  # 拦截购物车底部猜你喜欢/常买推荐
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/(mtop\\.wdk\\.cart\\.querycartrec|mtop\\.wdk\\.render\\.querycartfeedstream)/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"api":"","data":{"scenes":[]},"ret":["SUCCESS::接口调用成功"]}'

  # 拦截“我的”页面下方瀑布流推荐 & 搭配/通用推荐流
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/(mtop\\.wdk\\.render\\.querymypagerecommend|mtop\\.wdk\\.fc\\.recommend\\.queryrecommendlist|mtop\\.wdk\\.fc\\.recommend\\.feedscommondservice|mtop\\.wdk\\.melon\\.collocation)/"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"api":"","data":{"scenes":[]},"ret":["SUCCESS::接口调用成功"]}'

  # ---------------- 3. 页面模块精简与结构过滤 ----------------
  # 首页金刚区与推荐流精简
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/mtop\\.wdk\\.render\\.queryindexpage/"
    actions:
      - response_body:
          jq: "if .data?.pageType == \"1\" and .data?.scenes? then .data.scenes |= map(select(.bizCode == \"three_row_circle\")) else . end"

  # Feed 流推荐精简
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/mtop\\.wdk\\.render\\.querytabfeedstream/"
    actions:
      - response_body:
          jq: "if .data?.pageType == \"5\" and .data?.scenes? then .data.scenes |= map(select(.sceneType == \"100028\")) else . end"

  # 频道与独立落地页广告剥离（合并解决先前的规则拦截冲突）
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/(mtop\\.wdk\\.render\\.querychannelpage|mtop\\.wdk\\.render\\.querysinglepage)/"
    actions:
      - response_body:
          jq: "if .data?.pageType == \"216\" and .data?.scenes? then .data.scenes |= map(select(.bizCode == \"shop_walk_top_picture\" or .bizCode == \"shop_walk_shop_util\" or .bizCode == \"shop_walk_bistro\")) else . end"

  # “我的”页面模块精简：使用兼容性更好的正则白名单匹配，防止 JQ IN 函数报错
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/mtop\\.wdk\\.render\\.querymypage/"
    actions:
      - response_body:
          jq: "if .data?.scenes? then .data.scenes |= map(select((.sceneType // \"\") | test(\"^(400029|400005|400010|400002|400004|400015)$\"))) else . end"

  # 底栏白名单过滤：强制只保留 HOME、CLASSIFY、CART、MY 四个核心入口，并增加容错防护
  - match: "(?i)^https://acs-m\\.freshippo\\.com/gw/(mtop\\.wdk\\.lbs\\.location\\.shopdecideapi\\.decideformain|mtop\\.wdk\\.lbs\\.location\\.shopdecideapi\\.decidebygeocode)/"
    actions:
      - response_body:
          jq: >-
            if .data?.groupList? then
              .data.groupList |= map(
                if .ext?.tabConfig? then
                  .ext.tabConfig |= (
                    (if .normalTabList? then .normalTabList |= map(select(.code as $c | ["HOME", "CLASSIFY", "CART", "MY"] | any(. == $c))) else . end) |
                    (if .normalTabListB? then .normalTabListB |= map(select(.code as $c | ["HOME", "CLASSIFY", "CART", "MY"] | any(. == $c))) else . end)
                  )
                else . end
              )
            else . end

mitm:
  hostnames:
    includes:
      - acs-m.freshippo.com
