name: 盒马去广告🅥 (全链路对抗版)
description: |-
  彻底掐断 AMDC 调度、拦截阿里系大促活动流与开屏、精简底栏与瀑布流。
  更新时间：2026-11-02 11:49
open_url: https://apps.apple.com/app/id1063183999
author: 可莉🅥, AI 审计优化版
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MrHema.png

# 1. 本地 DNS 黑洞：无论阿里云 IP 怎么变，直接在 DNS 解析阶段阻断调度获取
dns:
  hosts:
    "amdc.m.taobao.com": 0.0.0.0
    "amdc.alipay.com": 0.0.0.0
    "orange-dc.m.taobao.com": 0.0.0.0
    "adash.m.taobao.com": 0.0.0.0
    "gm.mmstat.com": 0.0.0.0

rules:
  # 阻断阿里移动调度中心及配置中心，迫使其退回到系统标准 Local DNS 解析
  - domain:
      match: amdc.m.taobao.com
      policy: REJECT
  - domain:
      match: amdc.alipay.com
      policy: REJECT
  - domain:
      match: orange-dc.m.taobao.com
      policy: REJECT
  - domain:
      match: gm.mmstat.com
      policy: REJECT
  - domain:
      match: adash.m.taobao.com
      policy: REJECT
  - domain:
      match: dypnsapi-dualstack.aliyuncs.com
      policy: REJECT
  - domain:
      match: alimama.cloudvideocdn.taobao.com
      policy: REJECT
  - domain:
      match: mamasearchad.cloudvideocdn.taobao.com
      policy: REJECT

rewrites:
  # 拦截所有走 HTTP/HTTPS 的 AMDC 调度请求，阻断 IP 动态下发
  - match: "(?i)^https?://.*/amdc/mobileDispatch.*"
    actions:
      - respond:
          status: 404
          headers: {"Content-Type": "text/plain"}
          body: ""

  # ---------------- 1. 开屏启动页与双十一弹窗拦截 ----------------
  - match: "(?i)^https?://(acs-m\\.freshippo\\.com|.*-acs\\.m\\.taobao\\.com)/gw/(mtop\\.alimm\\.munion\\.render\\.openad\\.get|mtop\\.wdk\\.render\\.querywelcomepage|mtop\\.wdk\\.sg\\.queryinnerpage|mtop\\.wdk\\.sg\\.querysinglescene).*"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"api":"","data":{},"ret":["SUCCESS::接口调用成功"]}'

  # ---------------- 2. 购物车底部推荐瀑布流 ----------------
  - match: "(?i)^https?://(acs-m\\.freshippo\\.com|.*-acs\\.m\\.taobao\\.com)/gw/(mtop\\.wdk\\.cart\\.querycartrec|mtop\\.wdk\\.render\\.querycartfeedstream).*"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"api":"","data":{"scenes":[],"feeds":[]},"ret":["SUCCESS::接口调用成功"]}'

  # ---------------- 3. “我的”页面底部猜你喜欢/推荐瀑布流 ----------------
  - match: "(?i)^https?://(acs-m\\.freshippo\\.com|.*-acs\\.m\\.taobao\\.com)/gw/(mtop\\.wdk\\.render\\.querymypagerecommend|mtop\\.wdk\\.fc\\.recommend\\.queryrecommendlist|mtop\\.wdk\\.fc\\.recommend\\.feedscommondservice|mtop\\.wdk\\.melon\\.collocation).*"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"api":"","data":{"scenes":[],"items":[]},"ret":["SUCCESS::接口调用成功"]}'

  # ---------------- 4. 首页/双十一活动浮层及金刚区精简 ----------------
  - match: "(?i)^https?://(acs-m\\.freshippo\\.com|.*-acs\\.m\\.taobao\\.com)/gw/mtop\\.wdk\\.render\\.queryindexpage.*"
    actions:
      - response_body:
          jq: >-
            if .data?.scenes? then
              .data.scenes |= map(select(
                (.bizCode == "three_row_circle") or
                ((.bizCode // "" | test("banner|float|atmosphere|activity|double11|1111|promotion|popup|ad") | not))
              ))
            else . end

  # “我的”页面核心资产结构精简
  - match: "(?i)^https?://(acs-m\\.freshippo\\.com|.*-acs\\.m\\.taobao\\.com)/gw/mtop\\.wdk\\.render\\.querymypage.*"
    actions:
      - response_body:
          jq: >-
            if .data?.scenes? then
              .data.scenes |= map(select(
                ((.sceneType // "") | test("^(400029|400005|400010|400002|400004|400015)$")) and
                ((.bizCode // "" | test("banner|adv|ad|loan|financial|activity|double11") | not))
              ))
            else . end

  # 底部导航栏 Tab 白名单
  - match: "(?i)^https?://(acs-m\\.freshippo\\.com|.*-acs\\.m\\.taobao\\.com)/gw/(mtop\\.wdk\\.lbs\\.location\\.shopdecideapi\\.decideformain|mtop\\.wdk\\.lbs\\.location\\.shopdecideapi\\.decidebygeocode).*"
    actions:
      - response_body:
          jq: >-
            if .data?.groupList? then
              .data.groupList |= map(
                if .ext?.tabConfig? then
                  .ext.tabConfig |= (
                    (if .normalTabList? then .normalTabList |= map(select(.code as $c | ["HOME", "CLASSIFY", "CART", "MY"] | any(. == $c))) else . end) |
                    (if .normalTabListB? then .normalTabListB |= map(select(.code as $c | ["HOME", "CLASSIFY", "CART", "MY"] | any(. == $c))) else . end)
                  )
                else . end
              )
            else . end

mitm:
  hostnames:
    includes:
      - acs-m.freshippo.com
      - guide-acs.m.taobao.com
      - trade-acs.m.taobao.com
      - '*-acs.m.taobao.com'
