name: 京东去广告🅗 (彻底精简与去底栏逛版)
description: |-
  全量去广告：开屏、首页大促楼层、悬浮红包、弹窗，移除底栏“逛”短视频菜单。
  更新时间：2026-11-02 15:46
open_url: https://apps.apple.com/app/id414245413
author: zbsdsb / Codex, 深度定制版
homepage: https://github.com/zbsdsb/loon-adblock-plugins
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png

# 本地 DNS 黑洞：切断京东自建 HTTPDNS 解析
dns:
  hosts:
    "httpdns.jd.com": 0.0.0.0
    "dns.jd.com": 0.0.0.0

rules:
  # 1. 彻底封死京东自研与第三方 HTTPDNS 调度（强制退回标准域名解析走代理解密）
  - domain:
      match: httpdns.jd.com
      policy: REJECT
  - domain:
      match: dns.jd.com
      policy: REJECT
  - domain_keyword:
      match: httpdns
      policy: REJECT

  # 2. 拦截诊断测试与日志打点
  - url_regex:
      match: "^http://\\w{32}\\.jddebug\\.com/diagnose\\?"
      policy: REJECT
  - domain:
      match: dlog.jd.com
      policy: REJECT
  - domain:
      match: dsp-x.jd.com
      policy: REJECT
  - domain:
      match: kepler.jd.com
      policy: REJECT
  - domain:
      match: janapi.jd.com
      policy: REJECT

rewrites:
  # 1. 开屏启动物料拦截
  - match: '^https?://api\.m\.jd\.(com|hk)/client\.action\?(?:[^&]+&)*functionId=(?:start|queryMaterialAdverts)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"

  # 2. 彻底移除底栏【逛】菜单（原生 JQ 过滤，不依赖外部 JS 脚本）
  - match: '^https?://api\.m\.jd\.com/client\.action\?(?:[^&]+&)*functionId=(?:queryNavigation|getNavigationInfo|queryTabList)(?:&|$)'
    actions:
      - response_body:
          jq: >-
            if .data?.navigationList? then
              .data.navigationList |= map(select((.functionId // "" | test("guang|video|faxian|find") | not) and (.name // "" | test("逛|短视频|直播") | not)))
            elif .data?.tabList? then
              .data.tabList |= map(select((.functionId // "" | test("guang|video|faxian|find") | not) and (.name // "" | test("逛|短视频|直播") | not)))
            else . end

  # 3. 拦截首页大促悬浮挂件、红包弹窗与营销浮层
  - match: '^https?://api\.m\.jd\.com/client\.action\?(?:[^&]+&)*functionId=(?:floatLayer|popup|queryFloatLayer|queryFloatingLayer|queryPopups|bannerNotice)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":"0","data":{}}'

  # 4. 阻断节日/大促动态换肤（去掉双11大红底栏和挂件皮）
  - match: '^https?://api\.m\.jd\.com/client\.action\?(?:[^&]+&)*functionId=(?:skin|querySkin|getSkinInfo)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":"0","data":{}}'

scriptings:
- http_response:
    name: 京东全量去广告（脚本清洗）
    # 仅放行 api.m.jd.com，确保无参数 client.action 与常规业务接口被脚本正确接管
    match: '^https?://api\.m\.jd\.com/client\.action'
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/jd-adblock.js?v=8e5059b594
    body_required: true
    timeout: 10

mitm:
  hostnames:
    includes:
      - api.m.jd.com
