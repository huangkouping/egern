name: 京东去广告🅗 (直连IP封堵终极版)
description: |-
  根据实测抓包封死京东 HTTPDNS 直连通道与数据打点，强行激活 MitM，移除底栏“逛”及首页大促。
  更新时间：2026-11-02 16:01
open_url: https://apps.apple.com/app/id414245413
author: zbsdsb / Codex, 抓包逆向优化版
homepage: https://github.com/zbsdsb/loon-adblock-plugins
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png

rules:
  - domain:
      match: dns.jd.com
      policy: REJECT
  - domain:
      match: httpdns.jd.com
      policy: REJECT
  - domain_keyword:
      match: httpdns
      policy: REJECT
  - ip:
      match: 120.52.83.22
      policy: REJECT
  - ip:
      match: 39.156.62.242
      policy: REJECT
  - ip:
      match: 36.110.181.150
      policy: REJECT
  - ip:
      match: 111.202.8.189
      policy: REJECT
  - ip:
      match: 106.39.169.89
      policy: REJECT
  - ip:
      match: 111.13.29.201
      policy: REJECT
  - ip:
      match: 101.124.19.122
      policy: REJECT
  - domain:
      match: mars.jd.com
      policy: REJECT
  - domain:
      match: mllog.jd.com
      policy: REJECT
  - domain:
      match: anti-sdk-report.m.jd.com
      policy: REJECT
  - domain:
      match: perf.m.jd.com
      policy: REJECT
  - domain:
      match: sdkfp.jd.com
      policy: REJECT
  - domain:
      match: dlog.jd.com
      policy: REJECT
  - domain:
      match: dsp-x.jd.com
      policy: REJECT
  - domain:
      match: kepler.jd.com
      policy: REJECT
  - domain:
      match: janapi.jd.com
      policy: REJECT
  - domain_suffix:
      match: jddebug.com
      policy: REJECT

rewrites:
  # 1. 开屏启动物料拦截
  - match: '^https?://api\.m\.jd\.(com|hk)/client\.action\?(?:[^&]+&)*functionId=(?:start|queryMaterialAdverts)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"

  # 2. 彻底移除底栏【逛】菜单（原生 JQ 过滤，不依赖外部 JS 脚本）
  - match: '^https?://api\.m\.jd\.com/client\.action\?(?:[^&]+&)*functionId=(?:queryNavigation|getNavigationInfo|queryTabList)(?:&|$)'
    actions:
      - response_body:
          jq: >-
            if .data?.navigationList? then
              .data.navigationList |= map(select((.functionId // "" | test("guang|video|faxian|find") | not) and (.name // "" | test("逛|短视频|直播") | not)))
            elif .data?.tabList? then
              .data.tabList |= map(select((.functionId // "" | test("guang|video|faxian|find") | not) and (.name // "" | test("逛|短视频|直播") | not)))
            else . end

  # 3. 拦截首页大促悬浮挂件、红包弹窗与营销浮层
  - match: '^https?://api\.m\.jd\.com/client\.action\?(?:[^&]+&)*functionId=(?:floatLayer|popup|queryFloatLayer|queryFloatingLayer|queryPopups|bannerNotice)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":"0","data":{}}'

  # 4. 阻断节日/大促动态换肤（去掉双11大红底栏和挂件皮）
  - match: '^https?://api\.m\.jd\.com/client\.action\?(?:[^&]+&)*functionId=(?:skin|querySkin|getSkinInfo)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":"0","data":{}}'

scriptings:
- http_response:
    name: 京东全量去广告（脚本清洗）
    # 仅放行 api.m.jd.com，确保无参数 client.action 与常规业务接口被脚本正确接管
    match: '^https?://api\.m\.jd\.com/client\.action'
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/jd-adblock.js?v=8e5059b594
    body_required: true
    timeout: 10

mitm:
  hostnames:
    includes:
      - api.m.jd.com
