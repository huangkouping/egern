name: 京东去广告🅗 (协议修复全量版)
description: |-
  全量去广告：开屏、首页大促楼层、悬浮红包、弹窗，移除底栏“逛”短视频菜单。
  更新时间：2026-11-02 15:44
open_url: https://apps.apple.com/app/id414245413
author: zbsdsb / Codex, 协议修复版
homepage: https://github.com/zbsdsb/loon-adblock-plugins
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png

# 本地 DNS 黑洞：切断京东自建 HTTPDNS 解析
dns:
  hosts:
    "httpdns.jd.com": 0.0.0.0
    "dns.jd.com": 0.0.0.0

rules:
  # 1. 彻底封死京东自研与第三方 HTTPDNS 调度（强制退回标准域名解析走代理解密）
  - domain:
      match: httpdns.jd.com
      policy: REJECT
  - domain:
      match: dns.jd.com
      policy: REJECT
  - domain_keyword:
      match: httpdns
      policy: REJECT

  # 2. 拦截诊断测试与日志打点
  - url_regex:
      match: "^http://\\w{32}\\.jddebug\\.com/diagnose\\?"
      policy: REJECT
  - domain:
      match: dlog.jd.com
      policy: REJECT
  - domain:
      match: dsp-x.jd.com
      policy: REJECT
  - domain:
      match: kepler.jd.com
      policy: REJECT
  - domain:
      match: janapi.jd.com
      policy: REJECT

rewrites:
  # 1. 开屏物料阻断（兼容 URL Query 与路径无参形式）
  - match: '^https?://api\.m\.jd\.(com|hk)/client\.action\?(?:[^&]+&)*functionId=(?:start|queryMaterialAdverts)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"

  # 2. 阻断节日/大促动态换肤（避免双11全红皮和挂件底栏）
  - match: '^https?://api\.m\.jd\.(com|hk)/client\.action\?(?:[^&]+&)*functionId=(?:skin|querySkin)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":"0","data":{}}'

scriptings:
- http_response:
    name: 京东全量去广告与精简（脚本清洗）
    # 核心修正：取消 URL 参数严格过滤，全面接管 client.action（防止 POST Body 传参导致漏网）
    match: '^https?://api\.m\.jd\.(com|hk)/client\.action'
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/jd-adblock.js?v=8e5059b594
    body_required: true
    timeout: 10

mitm:
  hostnames:
    includes:
      - api.m.jd.com
      - api.m.jd.hk
