name: 京东去广告🅗 (精准修复终极版)
description: |-
  根据 HAR 抓包修复 Egern 语法，封堵直连 IPv4/IPv6 与 HTTPDNS 调度，强制 MitM 解密并清洗。
  更新时间：2026-11-02 16:56
open_url: https://apps.apple.com/app/id414245413
author: zbsdsb / Codex, 深度修复版
homepage: https://github.com/zbsdsb/loon-adblock-plugins
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png

rules:
  # 1. 语法修正：彻底阻断 HTTPDNS 与抓包暴露的域名
  - domain:
      match: dns.jd.com
      policy: REJECT
  - domain:
      match: httpdns.jd.com
      policy: REJECT
  - domain_keyword:
      match: httpdns
      policy: REJECT

  # 2. 使用 ip_cidr 封锁指定 IPv4 地址
  - ip_cidr:
      match: 120.52.83.22/32
      policy: REJECT
  - ip_cidr:
      match: 39.156.62.242/32
      policy: REJECT
  - ip_cidr:
      match: 36.110.181.150/32
      policy: REJECT
  - ip_cidr:
      match: 111.202.8.189/32
      policy: REJECT
  - ip_cidr:
      match: 106.39.169.89/32
      policy: REJECT
  - ip_cidr:
      match: 111.13.29.201/32
      policy: REJECT
  - ip_cidr:
      match: 101.124.19.122/32
      policy: REJECT
  - ip_cidr:
      match: 157.148.59.238/32
      policy: REJECT

  # 3. 拦截日志打点与高频性能监控
  - domain:
      match: mars.jd.com
      policy: REJECT
  - domain:
      match: mllog.jd.com
      policy: REJECT
  - domain:
      match: anti-sdk-report.m.jd.com
      policy: REJECT
  - domain:
      match: perf.m.jd.com
      policy: REJECT
  - domain:
      match: sdkfp.jd.com
      policy: REJECT
  - domain_suffix:
      match: jddebug.com
      policy: REJECT

rewrites:
  # 1. 开屏物料静态截断
  - match: '^https?://api\.m\.jd\.(com|hk)/client\.action\?(?:[^&]+&)*functionId=(?:start|queryMaterialAdverts)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"

  # 2. 阻断首页浮层与皮肤
  - match: '^https?://api\.m\.jd\.com/client\.action\?(?:[^&]+&)*functionId=(?:floatLayer|popup|queryFloatLayer|queryFloatingLayer|queryPopups|bannerNotice|skin|querySkin|getSkinInfo)(?:&|$)'
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":"0","data":{}}'

scriptings:
- http_response:
    name: 京东全量去广告（脚本接管）
    # 接管 client.action，确保 startup、uniformRecommend9 等全部进入脚本
    match: '^https?://api\.m\.jd\.com/client\.action'
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/jd-adblock.js?v=8e5059b594
    body_required: true
    timeout: 15

mitm:
  hostnames:
    includes:
      - api.m.jd.com
