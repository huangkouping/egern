name: 京东去广告与深度净化版©️
description: |-
  清理首页浮窗、推荐流及消息推广。
  更新时间：2026-10-15 20:04
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png

# 用户提供配置；未实机验证。
# 注意：全局阻断 QUIC，不限京东；全部 uniformRecommend 均被拦截。
# 可能影响首页正常商品推荐、二楼浏览历史、提醒及其他业务浮层。
# 阻断指定 HTTPDNS 入口不保证回落本地 DNS。
rules:
  - domain:
      match: dns.jd.com
      policy: REJECT
  - ip_cidr:
      match: 101.124.19.122/32
      policy: REJECT
      no_resolve: true
  - ip_cidr6:
      match: 2402:db40:5100:1011::5/128
      policy: REJECT
      no_resolve: true

  # 沿用用户配置：全局 QUIC 阻断
  - protocol:
      match: quic
      policy: REJECT

  - domain_suffix:
      match: dsp.jd.com
      policy: REJECT
  - domain_suffix:
      match: dsp-x.jd.com
      policy: REJECT
  - domain_suffix:
      match: bdsp-x.jd.com
      policy: REJECT
  - domain_suffix:
      match: janapi.jd.com
      policy: REJECT
  - domain_suffix:
      match: mars.jd.com
      policy: REJECT
  - domain_suffix:
      match: uranus.jd.com
      policy: REJECT

body_rewrites:
  # 首页顶层 floorList 中的 float / ruleFloat；移除弹窗字段
  - response_jq:
      match: '^https?://api\.m\.jd\.com/client\.action\?functionId=welcomeHome'
      filter: 'if .floorList then .floorList |= map(select(.type != "float" and .type != "ruleFloat")) else . end | del(.popMessage, .popMessageBig)'

  # 消息页推广开关；字段适配需实机确认
  - response_jq:
      match: '^https?://api\.m\.jd\.com/client\.action\?functionId=msgConfig'
      filter: '.popMainSwitch = false | .stationPVSwitch = "0" | .isPullStationRecord = "0" | .promotionWidgetUserFlag = "0"'

url_rewrites:
  # 拦截全部统一推荐，包括可能承载首页正常商品的接口
  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=uniformRecommend.*'
    location: http://reject-dict/

  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=stationPullService'
    location: http://reject-dict/

  # 整接口拦截，可能同时影响非广告内容
  - match: '^https?://api\.m\.jd\.com/.*functionId=(superRedBagHome|xview2Config|queryPagePopWindow|secondFloor|SecFloorBrowseHistory|deliverLayer)'
    location: http://reject-dict/

  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=(start|queryMaterialAdverts)'
    location: http://reject-dict/

  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=searchBoxWord'
    location: http://reject-dict/

mitm:
  hostnames:
    - api.m.jd.com
    - ms.jr.jd.com
