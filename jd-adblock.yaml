name: 京东去开屏与去首页浮窗（精准版）©️
description: |-
  拦截开屏、搜索推广，清理首页浮窗字段。
  更新时间：2026-10-15 14:42
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png

# 用户提供配置；浮窗字段是否适配当前京东版本需实机确认。
# 阻断指定 HTTPDNS 入口不保证回落本地 DNS，也不保证 HTTPS 可解密。
rules:
  - domain:
      match: dns.jd.com
      policy: REJECT
  - ip_cidr:
      match: 101.124.19.122/32
      policy: REJECT
      no_resolve: true
  - ip_cidr6:
      match: 2402:db40:5100:1011::5/128
      policy: REJECT
      no_resolve: true

  # 域名、协议与端口同时匹配，避免拦截正常 TCP 请求
  - and:
      match:
        - domain:
            match: api.m.jd.com
        - protocol:
            match: udp
        - dest_port:
            match: "443"
      policy: REJECT

  - domain_suffix:
      match: dsp.jd.com
      policy: REJECT
  - domain_suffix:
      match: dsp-x.jd.com
      policy: REJECT
  - domain_suffix:
      match: bdsp-x.jd.com
      policy: REJECT
  - domain_suffix:
      match: janapi.jd.com
      policy: REJECT

# 只删除指定 JSON 字段，不再整体拦截 welcomeHome。
body_rewrites:
  - response_jq:
      match: '^https?://api\.m\.jd\.com/client\.action\?functionId=(getTabHomeInfo|welcomeHome)(?:&|$)'
      filter: 'del(.data.floats, .data.floatLayer, .data.floatActivity, .data.bubble, .data.navigation.floats)'

url_rewrites:
  # 独立弹窗接口
  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=deliverLayer(?:&|$)'
    location: http://reject-dict/

  # 开屏与启动物料；保留原 start 前缀匹配行为
  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=(start|queryMaterialAdverts)'
    location: http://reject-dict/

  # 搜索默认推广词
  - match: '^https?://api\.m\.jd\.com/client\.action\?functionId=searchBoxWord(?:&|$)'
    location: http://reject-dict/

mitm:
  hostnames:
    - api.m.jd.com
