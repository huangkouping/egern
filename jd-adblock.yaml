name: 京东去广告🅗
description: |-
  全量去广告：开屏、首页推广楼层、我的/订单/物流页广告楼层与弹窗。
  适配京东 15.9.50+ 新协议（响应体 base64 化）：脚本解码后按内容特征清洗再按原格式回写，无可清内容原样放行。
  更新时间：2026-11-01 16:52
open_url: https://apps.apple.com/app/id414245413
author: zbsdsb[https://github.com/zbsdsb]
homepage: https://github.com/zbsdsb/loon-adblock-plugins
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png

# 基于 zbsdsb 的 JD_remove_ads_v2（2026-08-12，源头为 RuCu6/Maasea/可莉原插件）本地转换，脚本镜像至本仓库；2026-11-01 起替换此前仅开屏的极简版。
# 保留此前极简版的两条开屏物料拦截（start/queryMaterialAdverts）作为请求层双保险；jddebug 诊断上报拦截来自 v2 原插件。
# 注意：脚本会精简「我的」页工具栏（仅保留 10 个常用入口）并删除 PLUS 开通卡、评价提醒等楼层，均为 v2 原逻辑。已配置每 6 小时检查上游并安全同步，保留本地定制。
dns: {}
rules:
- url_regex:
    match: "^http://\\w{32}\\.jddebug\\.com/diagnose\\?"
    policy: REJECT
url_rewrites:
- match: '^https?://api\\.m\\.jd\\.com/client\\.action\\?(?:[^&]+&)*functionId=(?:start|queryMaterialAdverts)(?:&|$)'
  location: http://reject-dict/
scriptings:
- http_response:
    name: 京东全量去广告（新协议适配）
    match: "^https?://api\\.m\\.jd\\.com/client\\.action"
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/jd-adblock.js?v=8e5059b594
    body_required: true
    timeout: 20
mitm:
  hostnames:
    includes:
    - api.m.jd.com
