name: 京东比价©️
description: |-
  更新时间：2026-10-31 22:45
  京东商品详情页历史比价；操作步骤见模块使用说明。
manual: https://github.com/huangkouping/egern/blob/main/jd-price-guide.md
compat_arguments_desc: |-
  【使用说明】
  1. 启用本模块，关闭其他京东比价模块，确认 MitM 证书已安装并受信任。
  2. 打开慢慢买 App → 我的，收到“参数已保存”通知。
  3. 重新进入京东商品详情；未显示时点击商品“详情”。
  4. 模块更新后重新进入商品页即可，一般无需重新捕获参数。参数失效时重做第 2 步。

  【差价说明】
  差价＝该行价格－当前到手价。绿色负数表示更低，红色正数表示更高，相同显示 0，缺少有效价格显示 —。

  【数据说明】
  价格由慢慢买提供，仅供参考。参数仅在本机保存，查询时发送至慢慢买接口。
author: wf021325[https://github.com/wf021325], githubdulong[https://github.com/githubdulong], mw418[https://github.com/mw418], huangkouping
homepage: https://github.com/huangkouping/egern
open_url: https://apps.apple.com/app/id414245413
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png
# 基于公开源码的自维护适配；无可莉服务器依赖。
# 本地模拟测试通过，真实慢慢买接口及当前京东 App 效果待实测；手动维护。
scriptings:
- http_request:
    name: 捕获慢慢买参数
    match: '(?i)^https?://apapia-sqk-weblogic\.manmanbuy\.com/baoliao/center/menu(?:\?|$)'
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/jd-price.js?v=20261031-3
    body_required: true
    timeout: 10
    update_interval: 3600
- http_response:
    name: 京东历史比价
    match: '(?i)^https?://in\.m\.jd\.com/product/graphext/\d+\.html(?:\?|$)'
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/jd-price.js?v=20261031-3
    body_required: true
    timeout: 30
    update_interval: 3600
mitm:
  hostnames:
    includes:
    - in.m.jd.com
    - apapia-sqk-weblogic.manmanbuy.com
