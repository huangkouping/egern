name: 美图秀秀去广告🅥
description: |-
  拦截广告域名，精简部分页面推广。
  更新时间：2026-10-31 21:16
open_url: https://apps.apple.com/app/id416048305
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeiTu.png

# 基于用户提供的完整配置备份，保留原处理逻辑。
# 无远程 JS/jq 依赖；手动维护，未配置上游定时同步。
dns: {}
rules:
  - domain:
      match: adui.tg.meitu.com
      policy: REJECT
rewrites:
  - match: '(?i)^https://api\.posters\.meitu\.com/common/init\.json'
    actions:
      - response_body:
          jq: 'delpaths([["data","vip"]])'
mitm:
  hostnames:
    includes:
      - api.posters.meitu.com
