name: 芒果TV去广告🅥
description: |-
  去除开屏、信息流及播放页广告，精简我的页面。
  更新时间：2026-10-31 21:16
open_url: https://apps.apple.com/app/id629774477
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], RuCu6[https://github.com/RuCu6]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Mango_TV.png

# 基于用户提供的完整配置备份，合并频道及播放页重复接口处理。
# 补充原规则使用但 MITM 遗漏的 dc.bz.mgtv.com、comment.mgtv.com。
# 无远程 JS/jq 依赖；手动维护，未配置上游定时同步。
dns: {}
rules:
  - domain:
      match: credits.bz.mgtv.com
      policy: REJECT
  - domain:
      match: credits2.bz.mgtv.com
      policy: REJECT
  - domain:
      match: credits3.bz.mgtv.com
      policy: REJECT
  - domain:
      match: dflow.bz.mgtv.com
      policy: REJECT
  - domain:
      match: encounter.bz.mgtv.com
      policy: REJECT
  - domain:
      match: floor.bz.mgtv.com
      policy: REJECT
  - domain:
      match: layer.bz.mgtv.com
      policy: REJECT
  - domain:
      match: mob.bz.mgtv.com
      policy: REJECT
  - domain:
      match: rc-topic-api.bz.mgtv.com
      policy: REJECT
  - domain:
      match: rprain.bz.mgtv.com
      policy: REJECT
  - domain:
      match: rprain.log.mgtv.com
      policy: REJECT
  - domain:
      match: vip.bz.mgtv.com
      policy: REJECT
  - domain_suffix:
      match: da.mgtv.com
      policy: REJECT
rewrites:
  - match: "(?i)^https://dc\\.bz\\.mgtv\\.com/dynamic/v\\d/skin/config\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://dc\\.bz\\.mgtv\\.com/dynamic/v\\d/channel/ads\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^http://mobileso\\.bz\\.mgtv\\.com/spotlight/search/v\\d\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://damang\\.api\\.mgtv\\.com/station/album/red/dot\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://hb-boom\\.api\\.mgtv\\.com/release/pullReleaseInfo$"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://mobile\\.api\\.mgtv\\.com/v\\d/mobile/checkUpdate\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https?://mobile\\.api\\.(mgtv|hunantv)\\.com/mobile/config\\?"
    actions:
      - response_body:
          jq: "setpath([\"data\",\"dc_adConfig\"]; 0) | setpath([\"data\",\"XmsellSwitch\"]; 0) | setpath([\"data\",\"screenshot_share_switch\"]; 0) | setpath([\"data\",\"playerUseHttpDNS\"]; 0) | setpath([\"data\",\"damang_tab\"]; 0) | setpath([\"data\",\"relative_ads\"]; 0) | setpath([\"data\",\"second_floor_guide_switch\"]; 0) | setpath([\"data\",\"progress_bar_ad_switch\"]; 0) | setpath([\"data\",\"XmVideoB\"]; 0) | setpath([\"data\",\"damang_duanju_tab\"]; 0) | setpath([\"data\",\"playview_box_ad_switch\"]; 0) | setpath([\"data\",\"topBarSwitch\"]; 0) | setpath([\"data\",\"VIPSDKB2\"]; 0)"
  - match: "(?i)^https://me\\.bz\\.mgtv\\.com/v3/module/list\\?"
    actions:
      - response_body:
          jq: ".data.list |= map(select(.id | IN(1, 2, 4, 7))) | .data.list |= map(if .moduleType == 2 then .data |= map(select(.moduleType == 11)) elif .moduleType == 4 then .data |= map(select(.moduleType == 14 or .moduleType == 23)) elif .moduleType == 7 then .data |= map(select(.moduleType == 16 and .title != \"音乐广场\")) else . end)"
  - match: "(?i)^https://me\\.bz\\.mgtv\\.com/v4/module/list\\?"
    actions:
      - response_body:
          jq: ".data.list |= (map(select(.id != 3 and .id != 7))|map(if .id==2 then .data|=map(select(.id!=65))elif .id==4 then .data|=map(select(.title!=\"追更banner\" and .id!=57))elif .id==5 then .data|=(map(select(.id==9 or .id==13))|map(if .id==9 then .list|=map(select(.id==20 or .id==60 or .id==18)) else . end))elif .id==6 then .data|=map(select(.id==15)) else . end))"
  - match: "(?i)^https?://dc\\d?\\.bz\\.mgtv\\.com/dynamic/v\\d/channel/index/\\w"
    actions:
      - response_body:
          jq: "delpaths([[\"adInfo\"]]) | .data |= map(select(.moduleEntityId != \"10579\" and .moduleEntityId != \"9686\")) | .moduleIDS |= map(select(.moduleEntityId != \"10579\" and .moduleEntityId != \"9686\"))"
  - match: "(?i)^https://mobile-thor\\.api\\.mgtv\\.com/v\\d+/vod/info\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"config\",\"ad\"],[\"data\",\"config\",\"vipNav\"],[\"data\",\"template\",\"skinList\"],[\"data\",\"template\",\"theme\"]]) | .data.tabs |= map(select(.name == \"视频\" or .name == \"讨论\")) | .data.template.modules |= map(if .clipInfo.ext?.ipPublishEntrance then .clipInfo |= del(.ext) else . end) | .data.template.modules |= map(select(.dataType == 101 or .dataType == 201)) | .data.template.modules |= map(.media.list |= (if type == \"array\" then map(select(.type != 0)) else . end))"
  - match: "(?i)^https://comment\\.mgtv\\.com/v\\d/comment/getCommentList\\?"
    actions:
      - response_body:
          jq: ".data.list |= map(select(.type == 0))"
  - match: "(?i)^https?://mobileso\\.bz\\.mgtv\\.com/mobile/recommend/v\\d\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
mitm:
  hostnames:
    includes:
      - 'dc?.bz.mgtv.com'
      - dc.bz.mgtv.com
      - mobileso.bz.mgtv.com
      - damang.api.mgtv.com
      - hb-boom.api.mgtv.com
      - mobile.api.mgtv.com
      - mobile.api.hunantv.com
      - me.bz.mgtv.com
      - mobile-thor.api.mgtv.com
      - comment.mgtv.com
