name: 网易新闻去广告🅗
description: '清理网易新闻开屏广告、置顶内容、信息流推广及搜索推荐，补充广告接口与追踪域名拦截。

  脚本镜像每 6 小时检查上游；同步失败时保留上次有效版本。

  注意：新增接口与信息流过滤效果需实测，部分网易系域名拦截可能影响相关功能。

