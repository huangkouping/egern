          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://api\\.pinduoduo\\.com/api/alexa/homepage/hub\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"result\",\"dy_module\",\"irregular_banner_dy\"],[\"result\",\"icon_set\"],[\"result\",\"search_bar_hot_query\"]]) | .result.bottom_tabs? |= map(select(.link | IN(\"index.html\", \"chat_list.html\", \"personal.html\"))) | .result.buffer_bottom_tabs? |= map(select(.link | IN(\"index.html\", \"chat_list.html\", \"personal.html\"))) | .result.all_top_opts |= map(del(.selected_image, .image, .height, .width))"
  - match: "(?i)^https://api\\.pinduoduo\\.com/search\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"expansion\"]])"
  - match: "(?i)^https://api\\.pinduoduo\\.com/api/philo/personal/hub\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"monthly_card_entrance\"],[\"personal_center_style_v2_vo\"],[\"icon_set\",\"icons\"],[\"icon_set\",\"top_personal_icons\"],[\"personal_banner\"]])"
  - match: "(?i)^https://api\\.pinduoduo\\.com/api/oak/integration/render\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"bottom_section_list\"],[\"ui\",\"bottom_section\"],[\"ui\",\"live_section\",\"float_info\"]])"
  - match: "(?i)^https://api\\.pinduoduo\\.com/api/caterham/v3/query/order_detail_group\\?"
    actions:
      - response_body:
          jq: "delpaths([[\"data\",\"goods_list\"]])"
  - match: "(?i)^https://api\\.pinduoduo\\.com/order/"
    actions:
      - response_body:
          jq: "delpaths([[\"marketing_banner_vo\"],[\"shipping\",\"banner_above_recommend\"]])"
  - match: "(?i)^https://api\\.pinduoduo\\.com/api/aristotle/order_list_v4\\?"
    actions:
      - response_body:
          jq: ".orders |= map(.order_buttons |= map(del(.order_growth_tip)))"
mitm:
  hostnames:
    includes:
      - api.pinduoduo.com
