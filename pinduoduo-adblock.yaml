  原有应用内规则保持不变，补全扫码取件页 HTML 清理和页面组件替换。

  两个依赖已合并备份到本仓库，不再访问可莉脚本地址。

  每 6 小时检查两个公开镜像；失败保留上次有效版本。

  镜像源码标注 2026-07-11，未必与可莉服务器当前版本一致，App 效果待实测。'
