name: 拼多多去广告©️
description: |-
  去除广告及推广，精简首页和个人中心；不含扫码取件页去广告。
  更新时间：2026-10-31 20:17
open_url: https://apps.apple.com/app/id1044283059
author: ZenmoFeiShi[https://github.com/ZenmoFeiShi], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/PinDuoDuo.png

# 基于用户提供的配置备份；按用户要求省略无法读取的扫码取件页脚本。
# 合并首页 hub 的重复匹配，删除重复 titan 域名及重复 delpaths 路径。
# 无远程 JS/jq 依赖；手动维护，未配置上游定时同步。
dns: {}
rules:
  - and:
      match: [{"url_regex":{"match":"^http://((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/d(\\d)?"}},{"user_agent":{"match":"*com.xunmeng.pinduoduo*"}}]
      policy: "REJECT"
  - and:
      match: [{"url_regex":{"match":"^http://\\[[0-9a-fA-F:]+\\]/d(\\d)?\\?"}},{"user_agent":{"match":"*com.xunmeng.pinduoduo*"}}]
      policy: "REJECT"
  - and:
      match: [{"domain":{"match":"api.pinduoduo.com"}},{"protocol":{"match":"QUIC"}}]
      policy: "REJECT"
  - domain:
      match: "titan.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "xg.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "cdl-1.pddpic.com"
      policy: "REJECT"
  - domain:
      match: "cdl-p2.pddpic.com"
      policy: "REJECT"
  - domain:
      match: "cd-1.pddpic.com"
      policy: "REJECT"
  - domain:
      match: "apm.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "th-b.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "ta.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "th.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "th-a.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "ta-a.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "meta.pinduoduo.com"
      policy: "REJECT"
  - domain:
      match: "apm-a.pinduoduo.com"
      policy: "REJECT"
rewrites:
  - match: "(?i)^https://api\\.pinduoduo\\.com/api/aristotle/unrated_order_for_unreceived_tab\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
