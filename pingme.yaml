name: PingMe签到
description: 😀 PingMe 自动签到
compat_arguments:
  arg3: '0 */4 * * *'
  PROXY: 美国节点
compat_arguments_schema:
  arg3:
    name: 签到时间
    description: 默认每天0点开始，每4小时签到一次；可填写 Cron 表达式调整。
    default_value: '0 */4 * * *'
  PROXY:
    name: 代理策略
    description: 填写主配置中的策略组名称，需完全一致；例如“美国节点”。
    default_value: 美国节点
env:
  PINGME_CAPTURE: 'true'
env_schema:
  PINGME_CAPTURE:
    name: 抓取签到参数
    description: 默认开启。关闭后不再抓取签到参数；脚本每次运行会随机生成设备ID。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
author: mickeu 修改为Egern版（添加随机设备ID与参数开关）
icon: https://raw.githubusercontent.com/axhani/icon/refs/heads/main/pingme&wetalk.png
dns: {}
rules:
- domain:
    match: api.pingmeapp.net
    policy: PROXY
scriptings:
- schedule:
    name: PingMe签到
    cron: '{{{arg3}}}'
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/PingMeSignin.js?t=2
    timeout: 300
    update_interval: 3600
- http_request:
    name: PingMe获取签到参数
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/pingme_capture.js?t=2
    timeout: 60
    update_interval: 3600
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net