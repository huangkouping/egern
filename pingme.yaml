name: PingMe签到
description: 😀 新增PingMe签到 | 🤫 支持获取签到参数和每日签到&任务 | 🤫 原作者 @ZenMoFiShi | mickeu修改为支持 🎈Egern 并添加随机设备ID与参数开关 | 😀 
compat_arguments:
  arg3: '30 8,20 * * *'
  PROXY: 美国节点
compat_arguments_schema:
  arg3:
    name: PM定时
    default_value: '30 8,20 * * *'
  PROXY:
    name: 美国节点
    description: 代理规则使用的策略
    default_value: 美国节点
    options:
    - 美国节点
    - DIRECT
    - 手动选择
    - 自动选择
    - 故障转移
    - 负载均衡
env:
  PINGME_CAPTURE: 'true'
env_schema:
  PINGME_CAPTURE:
    name: PM'token
    description: 关闭后不再抓取签到参数（默认开启 true）。每运行一次随机生成设备ID，防止被检测。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
author: mickeu 修改为Egern版（添加随机设备ID与参数开关）
icon: https://raw.githubusercontent.com/axhani/icon/refs/heads/main/pingme&wetalk.png
dns: {}
rules:
- domain:
    match: api.pingmeapp.net
    policy: 美国节点
scriptings:
- schedule:
    name: PingMe签到
    cron: '{{{arg3}}}'
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/PingMeSignin.js?t=2
    timeout: 300
    update_interval: 3600
- http_request:
    name: PingMe获取签到参数
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/mickeu/Egern/main/pingme_capture.js?t=2
    timeout: 60
    update_interval: 3600
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net