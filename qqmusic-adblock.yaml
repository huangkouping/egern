      policy: REJECT
  - domain:
      match: adcdn6.tencentmusic.com
      policy: REJECT
  - domain:
      match: adexpo.tencentmusic.com
      policy: REJECT
  - domain:
      match: adclick.tencentmusic.com
      policy: REJECT
  - domain:
      match: mc.tencentmusic.com
      policy: REJECT
  - domain:
      match: monitor.music.qq.com
      policy: REJECT
  - domain:
      match: tmead.y.qq.com
      policy: REJECT
  - domain:
      match: tmeadbak.y.qq.com
      policy: REJECT
  - domain:
      match: tmeadquic.y.qq.com
