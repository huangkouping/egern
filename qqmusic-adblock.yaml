name: QQ音乐去广告©️
description: |-
  拦截 QQ 音乐广告及广告统计域名。
  更新时间：2026-10-31 21:08
open_url: https://apps.apple.com/app/id414603431
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
