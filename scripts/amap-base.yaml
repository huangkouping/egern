name: 高德地图去广告🅥
description: |
  更新时间：待同步
  开屏、首页及地点推广过滤，精简页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://github.com/huangkouping/egern
open_url: https://apps.apple.com/app/id461703208
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Amap.png
compat_arguments_desc: |-
  【使用说明】
  启用模块，确认 MitM 已开启且证书受信任，然后重新打开高德地图。
  请关闭其他高德去广告模块，避免重复修改同一接口。
  本地维护 27 条重写与 1 条网址重写（原 23 条，另于 2026-11-01 嫁接墨鱼 AmapAds 独有的 5 条纯拦截：路线规划广告、广告归因、天气推广、开屏 aos 路径与 uploadimg 动图）；两个 jq 依赖从公开镜像同步并内嵌，无可莉服务器运行依赖。
  每 6 小时检查一次公开镜像；同步失败时保留上次有效规则，并更新同步状态。
  公开镜像未必与可莉服务器当前版本一致，实际效果以 App 测试为准。
dns: {}
rewrites:
- match: (?i)^https://m5\.amap\.com/ws/valueadded/alimama/splash_screen\?
  actions:
  - respond:
      status: 200
      headers: {Content-Type: application/json}
      body: '{}'
- match: (?i)^https://m5\.amap\.com/ws/shield/frogserver/aocs/updatable/1\?
  actions:
  - response_body:
      jq: delpaths([["data","adStatementConfig"],["data","adCustomerRetainArchitecture"],["data","adImEntryConfig"],["data","adVenueConfig"],["data","adPerfSwitch"],["data","EndNaviC3AdCard"],["data","infoCpcReport"],["data","hotsaleConfig"],["data","marketing_resource_config"],["data","coupon_risk_asac"],["data","commonCouponSceneLog"],["data","sug_coupon_opt"],["data","giftEntryConfig"],["data","splashscreen"],["data","SplashScreenControl"],["data","splashview_config"],["data","feedback_banner"],["data","TrainOrderBanner"],["data","nearby_business_popup"],["data","shortcut_popup_frequency"],["data","tel_retention_popup"],["data","hotel_activity"],["data","taxi_activity"],["data","hotel_privilege"],["data","sportsActivityConfig"],["data","activity_qingke_contry_control"],["data","920bestwishes"],["data","custom_consultdata","widget_guide"],["data","free_ride"],["data","homepage_resource_config"],["data","home_message_guide"],["data","hotel_tipsicon"],["data","sur_bar"],["data","nearby_map_entry_guide"],["data","comment_info"],["data","small_biz_index"],["data","small_biz_fun"],["data","setpagesearch"],["data","wallet"]])
- match: (?i)^https://m5\.amap\.com/ws/shield/frogserver/aocs/updatable/1\?
  actions:
  - response_body:
      jq: {url: 'https://kelee.one/Resource/JQLang/Amap/updatable.jq'}
- match: (?i)^https://m5\.amap\.com/ws/shield/dsp/profile/index/nodefaasv3\?
  actions:
  - response_body:
      jq: del(.data.tipData, .data.wallet) | .data.cardList |= map(select(.dataKey == "MineNewFootprintCard" or .dataKey == "MineNewBEntranceCardV4")) | (.data.cardList[] | select(.dataKey == "MineNewBEntranceCardV4") | .content.entranceList_1) |= map(select(.id == 7 or .id == 8 or .id == 10 or .id == 17)) | (.data.cardList[] | select(.dataKey == "MineNewBEntranceCardV4") | .content.entranceList_2) |= map(select(.id == 32 or .id == 4 or .id == 9 or .id == 16 or .id == 14))
- match: (?i)^https://m5\.amap\.com/ws/shield/scene/recommend\?
  actions:
  - response_body:
      jq: delpaths([["$","data","shadingWords"]])
- match: (?i)^https://m5\.amap\.com/ws/shield/scene/recommend\?
  actions:
  - response_body:
      jq: .data.toolsRecommend.data.default |= map(select(.id == 102 or .id == 103 or .id == 106 or .id == 151))
- match: (?i)^https://sns\.amap\.com/ws/opc/tools/list\?
  actions:
  - response_body:
      jq: (if (type == "object") and ((.data | type) == "object") and ((.data.category | type) == "array") then (.data.category[] | select(type == "object") | .tools | select(type == "array") | .[] | select(type == "object")) |= del(.tips) else . end) | (if (type == "object") and ((.data | type) == "object") and ((.data.category | type) == "array") then (.data.category[] | select(type == "object") | .tools | select(type == "array")) |= map(select(if type == "object" then (((.id | type) == "string" and .id == "547") or ((.id | type) == "number" and .id == 547)) | not else true end)) else . end)
- match: (?i)^https://m5\.amap\.com/ws/faas/amap-navigation/main-page-assets\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://m5\.amap\.com/ws/faas/amap-navigation/main-page-aiqs\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://ai\.amap\.com/v1/ai_rec/home_qs\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://info\.amap\.com/ws/c3frontend/af-search/search\?
  actions:
  - response_body:
      jq: if (try (.data.modules.quickLink.data.list | type) catch null) == "array" then .data.modules.quickLink.data.list |= map(if type == "object" and (.badge | type) == "object" and (.badge | has("text")) then .badge.text = "" else . end) else . end
- match: (?i)^https://m5-zb\.amap\.com/ws/promotion-web/resource(/home)?\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://m5-zb\.amap\.com/ws/boss/car/order/content_info\?
  actions:
  - response_body:
      jq: delpaths([["data","lubanData","skin"],["data","lubanData","kingToolBoxBubble"],["data","lubanData","popup"]])
- match: (?i)^https://m5-zb\.amap\.com/ws/boss/car/order/content_info\?
  actions:
  - response_body:
      jq: 'def on_path($p; $t; f): if (try (getpath($p) | type == $t) catch false) then getpath($p) |= f else . end; (on_path(["data","lubanData","kingToolSort","dataList"]; "array"; map(if type == "object" then (if ((try (.biz | type) catch null) == "object" and (.biz | has("kingToolIdList"))) then (.biz.kingToolIdList |= (if type == "array" then map(select(IN("dache_toolbox_GDIntercity","dache_toolbox_hitch","dache_toolbox_chauffeur","dache_toolbox_quality","dache_toolbox_charterCar"))) else . end)) else . end) else . end))) | on_path(["data","lubanData","kingToolBox","dataList"]; "array"; map(select(if type == "object" then ((try (.biz | type) catch null) == "object" and (try (.biz.id | IN("dache_toolbox_GDIntercity","dache_toolbox_hitch","dache_toolbox_chauffeur","dache_toolbox_quality","dache_toolbox_charterCar")) catch false)) else false end)))'
- match: (?i)^https://m5-zb\.amap\.com/ws/amap/hitch/passenger/content_info\?
  actions:
  - response_body:
      jq: delpaths([["data","lubanData","banner"]])
- match: (?i)^https://m5\.amap\.com/ws/info_bff/rankingCard\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://center\.amap\.com/ws/amc/server/conv/raise_list\?
  actions:
  - response_body:
      jq: 'def on_path($p; $t; f): if (try (getpath($p) | type == $t) catch false) then getpath($p) |= f else . end; on_path(["data","dataList"]; "array"; map(select(if type == "object" then (has("categoryId") or ((.data | type) == "object" and .data.id == "M_100007")) else false end)))'
- match: (?i)^https://m5\.amap\.com/ws/shield/scene/recommend\?
  actions:
  - response_body:
      jq: (if (try (.data.shadingWords.data.regions.content | type == "array") catch false) then .data.shadingWords.data.regions.content |= map(select(IN("quickLink","history","searchFind"))) else . end) | (if (try (.data.shadingWords.data.modules | type == "object") catch false) then .data.shadingWords.data.modules |= with_entries(select(.key == "searchFind")) else . end)
- match: (?i)^https://info\.amap\.com/ws/shield/search_business/process/middleLayer/sug\?
  actions:
  - response_body:
      jq: .tip_list |= map(select(.tip.task_tag == "common_content_general" or .tip.task_tag == "sp"))
- match: (?i)^https://info\.amap\.com/ws/shield/search/poi/detail\?
  actions:
  - response_body:
      jq: delpaths([["data","modules","combineReviews","data","write_comment","btnRightTag"],["data","modules","combineReviews","data","write_comment","title"]])
- match: (?i)^https://info\.amap\.com/ws/shield/search/poi/detail\?
  actions:
  - response_body:
      jq: {url: 'https://kelee.one/Resource/JQLang/Amap/search_poi_detail.jq'}
- match: (?i)^https://m5\.amap\.com/ws/smartui/near_recommend\?
  actions:
  - response_body:
      jq: delpaths([["data","operation_activity"]])
- match: (?i)^https://m5\.amap\.com/ws/shield/search_business/process/marketingOperationStructured\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://m5\.amap\.com/ws/faas/amap-navigation/card-service-route-plan\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://m5\.amap\.com/ws/asa/ads_attribution
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://m5\.amap\.com/ws/valueadded/weather\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
- match: (?i)^https://m5\.amap\.com/ws/aos/alimama/splash_screen\?
  actions:
  - respond: {status: 200, headers: {Content-Type: application/json}, body: '{}'}
url_rewrites:
- match: (?i)^https?://[a-z0-9-]+\.amap\.com/uploadimg/\w+\.gif
  location: http://reject-img/
mitm:
  hostnames:
    includes:
    - m5.amap.com
    - ai.amap.com
    - m5-zb.amap.com
    - center.amap.com
    - sns.amap.com
    - info.amap.com

