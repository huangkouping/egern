name: 百度与Google搜索自动翻页🅗
description: |-
  百度与 Google 移动端搜索结果自动翻页，独立于搜索去广告模块。
  更新时间：2026-11-01 22:07

author: huangkouping
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Baidu.png

mitm:
  hostnames:
    - m.baidu.com
    - www.baidu.com
    - www.google.com
    - www.google.com.*
    - www.google.co.*

scriptings:
  - http_response:
      name: SearchAutoPage
      match: ^https?:\/\/((m|www)\.baidu\.com\/(s|from=)|www\.google\.(com|[a-z]{2,3}|com\.[a-z]{2}|co\.[a-z]{2})\/search\?)
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/search_autopage.js
      body_required: true
      max_size: 524288
