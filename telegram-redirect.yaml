# Version: 1.1.0
# Updated: 2026-10-06 09:30
name: Telegram跳转©️
description: |-
  将 Telegram 链接跳转到指定客户端。
  支持 Telegram、Nagram、Swiftgram、Turrit、iMe、Nicegram、Lingogram。
author: huangkouping
icon: https://iili.io/KQX347S.png

env_schema:
  CLIENT:
    name: Telegram 客户端
    description: 选择要跳转到的客户端
    default_value: Nagram
    options:
      - Telegram
      - Nagram
      - Swiftgram
      - Turrit
      - iMe
      - Nicegram
      - Lingogram

scriptings:
  - http_request:
      name: Telegram 链接跳转©️
      match: ^https?://(t\.me|telegram\.me)/.+
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/telegram-redirect.js
      timeout: 10

mitm:
  hostnames:
    - t.me
    - telegram.me
