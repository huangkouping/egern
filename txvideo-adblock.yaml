name: 腾讯视频去广告🅗
description: |-
  清理腾讯视频开屏、播放前/播放中广告及部分页面推广内容，精简底部标签和个人中心。
  更新时间：2026-11-01（上游同步）
  来源：ZenmoFeiShi/Qx；每 6 小时检查上游 JS，失败保留旧版。
icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/TencentVideo.png
open_url: https://apps.apple.com/app/id458318329
author: ZenmoFeiShi[https://github.com/ZenmoFeiShi/Qx]
homepage: https://github.com/huangkouping/egern
dns: {}
rules:
  - domain:
      match: iacc.stgw.qq.com
      policy: REJECT
  - domain:
      match: tacc.video.qq.com
      policy: REJECT
scriptings:
  - http_request:
      name: 腾讯视频请求净化
      match: '^https?://i\.video\.qq\.com/(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/txvideo-adblock.js
      body_required: true
      timeout: 20
  - http_response:
      name: 腾讯视频响应净化
      match: '^https?://i\.video\.qq\.com/(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/txvideo-adblock.js
      body_required: true
      timeout: 20
  - http_response:
      name: 腾讯视频JCE净化
      match: '^https?://iacc\.qq\.com/(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/txvideo-adblock.js
      body_required: true
      timeout: 20
  - http_response:
      name: 腾讯视频Tab配置
      match: '^https?://config\.ab\.qq\.com/tab/GetTabRemoteConfig(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/txvideo-adblock.js
      body_required: true
      timeout: 20
  - http_response:
      name: 腾讯视频页面配置
      match: '^https://rdelivery\.qq\.com/v1/sdkconfig/get(?:\?.*)?$'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/txvideo-adblock.js
      body_required: true
      timeout: 20
mitm:
  hostnames:
    includes:
      - i.video.qq.com
      - iacc.qq.com
      - config.ab.qq.com
      - rdelivery.qq.com
