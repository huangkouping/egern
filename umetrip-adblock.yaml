name: 航旅纵横去广告
description: |-
  屏蔽开屏、首页及应用内广告。
  规则更新时间：2026-10-05 17:49（北京时间）
  同步检查：2026-10-05 17:50（北京时间）
  墨鱼源：成功
author: ddgksf2013 / huangkouping
icon: airplane
homepage: https://github.com/huangkouping/egern

url_rewrites:
  - match: '^https:\/\/oss\.umetrip\.com\/fs\/advert\/'
    location: 'http://reject-img/'

scriptings:
  - http_response:
      name: 航旅纵横广告净化
      match: '^https?://(?:activity\.umetrip\.com|appmsg\.umetrip\.com|event\.umetrip\.com|flightstatus\.umetrip\.com|home\.umetrip\.com|opactivity\.umetrip\.com|sns\.umetrip\.com|startup\.umetrip\.com|umeflightstatus\.umetrip\.com|umehome\.umetrip\.com|umerp\.umetrip\.com|umestartup\.umetrip\.com|umeuser\.umetrip\.com|user\.umetrip\.com)/gateway/api/umetrip/native(?:\\?.*)?$'
      script_url: https://raw.githubusercontent.com/huangkouping/egern/main/umetrip-adblock.js?v=202610051735
      body_required: true
      timeout: 15
      update_interval: 3600

mitm:
  hostnames:
    includes:
      - activity.umetrip.com
      - appmsg.umetrip.com
      - event.umetrip.com
      - flightstatus.umetrip.com
      - home.umetrip.com
      - opactivity.umetrip.com
      - oss.umetrip.com
      - sns.umetrip.com
      - startup.umetrip.com
      - umeflightstatus.umetrip.com
      - umehome.umetrip.com
      - umerp.umetrip.com
      - umestartup.umetrip.com
      - umeuser.umetrip.com
      - user.umetrip.com
