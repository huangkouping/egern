name: 威锋去广告🅥
description: |-
  移除开屏广告、信息流广告、文末广告、首页轮播图推广。
  更新时间：2026-10-31 22:02
open_url: https://apps.apple.com/app/id1411932809
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/WPForum.png
# 基于用户提供的配置备份；无远程 JS/jq 依赖，手动维护。
dns: {}
rewrites:
- match: (?i)^https://api\.wfdata\.club/v2/yesfeng/yesList\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://api\.wfdata\.club/v2/yesfeng/slideshow\?
  actions:
  - response_body:
      jq: .data |= map(select(.protocolId == 1))
mitm:
  hostnames:
    includes:
    - api.wfdata.club
