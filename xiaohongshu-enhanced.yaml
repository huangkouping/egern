name: 小红书去直播广告(完整版)🅗
description: |-
  屏蔽开屏、首页直播、广告与热搜推荐，支持笔记、评论图片、视频及实况保存去水印。
  新增搜索结果广告与直播过滤，保留原增强版全部功能。
  更新时间：2026-11-08 09:40
author: huangkouping / Codex, AI 精准校准版
homepage: https://github.com/huangkouping/egern
icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/xiaohongshu.png

env_schema:
  BLOCK_SEARCH_ADS:
    name: 屏蔽搜索结果广告
    description: 复用首页商业广告字段识别。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  BLOCK_SEARCH_LIVE:
    name: 屏蔽搜索结果直播
    description: 过滤搜索结果中明确标记的直播卡片。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  BLOCK_HOME_ADS:
    name: 屏蔽首页广告
    description: 关闭后恢复首页“发现”信息流中的商业投放广告。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  BLOCK_HOME_LIVE:
    name: 屏蔽首页直播
    description: 屏蔽直播卡片及作者正在直播的普通笔记。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  BLOCK_MEDICAL_PROMOTION:
    name: 屏蔽疑似医美推广
    description: 根据账号和内容特征组合识别，可能误删，可随时关闭。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  BLOCK_SPLASH_ADS:
    name: 屏蔽开屏广告
    description: 清空开屏候选素材并取消开屏广告投放决策。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  BLOCK_AD_RESOURCES:
    name: 屏蔽广告素材库
    description: 清空广告素材库接口下发的图片和视频链接。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  BLOCK_AD_ENGAGE:
    name: 屏蔽广告互动内容
    description: 清空广告互动接口下发的默认图片和跳转信息。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  REMOVE_MEDIA_WATERMARK:
    name: 媒体保存去水印
    description: 处理水印开关、封面标记及原始媒体地址；关闭后不处理笔记去水印。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ENABLE_MEDIA_SAVE:
    name: 完善保存入口与限制处理
    description: 开启保存配置并补充视频下载入口；仅有明确匹配缓存时补全保存响应。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  REMOVE_COMMENT_WATERMARK:
    name: 评论区图片与实况去水印
    description: 处理评论及楼中楼身份标记、表情图片原地址和实况视频；受媒体去水印总开关控制。
    default_value: 'true'
    options:
    - 'true'
    - 'false'

rules:
  # 拦截小红书数据埋点、崩溃上报与追踪
  - domain:
      match: log.xiaohongshu.com
      policy: REJECT
  - domain:
      match: track.xiaohongshu.com
      policy: REJECT
  - domain:
      match: crash.xiaohongshu.com
      policy: REJECT
  # 拦截腾讯 HTTPDNS（防止小红书逃逸 MitM 解密）
  - ip_cidr:
      match: 119.29.29.0/24
      policy: REJECT

scriptings:
- http_response:
    name: 小红书搜索结果广告与直播过滤
    match: ^https://[a-zA-Z0-9.-]+\.xiaohongshu\.com/api/sns/(?:v\d+/search/|web/v\d+/search/).*
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/xiaohongshu-search-filter.js?v=20261108-1
    body_required: true
    timeout: 10
    update_interval: 3600

- http_response:
    name: 小红书首页广告与直播过滤
    match: ^https://[a-zA-Z0-9.-]+\.xiaohongshu\.com/api/sns/(?:v\d+/homefeed|web/v\d+/homefeed)(?:\?|$)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/xiaohongshu-homefeed-adblock.js?v=20261005-8
    body_required: true
    timeout: 10
    update_interval: 3600

- http_response:
    name: 小红书开屏广告过滤
    match: ^https://edith\.xiaohongshu\.com/api/sns/v2/system_service/(?:splash_config|splash_online_decision|splash_async_optimization)(?:\?|$)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/xiaohongshu-homefeed-adblock.js?v=20261005-8
    body_required: true
    timeout: 5
    update_interval: 3600

- http_response:
    name: 小红书广告素材与互动内容过滤
    match: ^https://(?:edith|www)\.xiaohongshu\.com/api/sns/v1/(?:ads/resource|tag/ads_engage)(?:\?|$)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/xiaohongshu-homefeed-adblock.js?v=20261005-8
    body_required: true
    timeout: 5
    update_interval: 3600

- http_response:
    name: 小红书保存去水印
    match: ^https?://[a-zA-Z0-9.-]+\.xiaohongshu\.com/api/sns/v\d+/(?:note/(?:tabfeed|redtube|videofeed|feed|imagefeed|video/save|live_photo/save)|system_service/config)(?:\?|$)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/xiaohongshu-watermark.js?v=20261101-1
    body_required: true
    timeout: 10
    update_interval: 3600

- http_response:
    name: 小红书评论区保存去水印
    # 关键修正：完整还原 interaction/comment/video/download，确保动态图实况视频去水印被脚本截获
    match: ^https?://[a-zA-Z0-9.-]+\.xiaohongshu\.com/api/sns/v\d+/(?:note/comment/(?:list|sub_comments?|web/list)|interaction/comment/video/download)(?:\?|$)
    script_url: https://raw.githubusercontent.com/huangkouping/egern/main/xiaohongshu-watermark.js?v=20261101-1
    body_required: true
    timeout: 10
    update_interval: 3600

# 关键修正：还原原生 reject-img 行为，让客户端禁用保存时动态盖水印
url_rewrites:
- match: (?i)^https://ci\.xiaohongshu\.com/system_config/watermark
  location: http://reject-img/

rewrites:
  # 拦截开屏预加载接口（直接清空数据）
  - match: "(?i)^https://edith\\.xiaohongshu\\.com/api/sns/v2/system_service/(splash_pull_online|splash_list)"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":0,"success":true,"data":{"ads":[],"splash_list":[]}}'

  # 拦截商业广告点击与曝光上报
  - match: "(?i)^https?://[a-zA-Z0-9.-]+\\.xiaohongshu\\.com/api/sns/v\\d+/(ads/track|commercial/)"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":0,"success":true}'

  # 清空搜索框商业推广热搜词
  - match: "(?i)^https?://[a-zA-Z0-9.-]+\\.xiaohongshu\\.com/api/sns/v\\d+/search/trending"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":0,"success":true,"data":{"queries":[]}}'

mitm:
  hostnames:
    includes:
    - ci.xiaohongshu.com
    - rec.xiaohongshu.com
    - so.xiaohongshu.com
    - www.xiaohongshu.com
    - edith.xiaohongshu.com
    - '*.xiaohongshu.com'

compat_arguments_desc: |-
  使用说明：启用HTTPS解密并信任证书；更新模块后重新打开小红书。
  去水印建议先清除App媒体缓存，再进入笔记及评论区加载媒体，最后保存，旧相册图片不会自动改变。
  三个新增开关分别控制媒体去水印、保存入口/限制处理、评论区去水印，默认开启。
  原始视频和实况地址须先从详情/评论接口取得；本地最多缓存各300项、有效7天，不发起外部请求。
  只用明确匹配的笔记/文件/视频ID替换保存地址，未取得原始地址时保留响应。
  普通图片若水印已写入原图像素，接口规则无法直接擦除。
  现有广告、直播和疑似医美过滤开关保持原逻辑。
  完整版：保留原增强版全部规则，并新增搜索结果广告与直播过滤。
  本模块自行维护。
