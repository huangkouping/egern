    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: '(?i)^https://marketing-aibox\.v\.mitvos\.com/payGuide/halfScreenMulti/(home|cache)\?'
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
  - match: '(?i)^https://marketing-aibox\.v\.mitvos\.com/payGuide/tabPage\?'
    actions:
      - respond:
          status: 200
          headers:
            Content-Type: application/json
          body: '{}'
mitm:
  hostnames:
    includes:
      - marketing-aibox.v.mitvos.com
