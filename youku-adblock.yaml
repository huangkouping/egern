name: 优酷视频去广告🅥
description: |-
  过滤部分开屏、视频及信息流广告，无法覆盖全部广告。
  更新时间：2026-10-31 21:16
open_url: https://apps.apple.com/app/id336141475
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], RuCu6[https://github.com/RuCu6]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/YouKu_Video.png

# 基于用户提供的完整配置备份，仅删除 yk-ssp.ad.youku.com、cad.youku.com 的重复规则。
# 保留原直连例外及规则顺序。
# 无远程 JS/jq 依赖；手动维护，未配置上游定时同步。
dns: {}
rules:
  - domain:
      match: push.m.youku.com
      policy: DIRECT
  - domain:
      match: un-acs.youku.com
      policy: DIRECT
  - domain:
      match: dorangesource.alicdn.com
      policy: DIRECT
  - domain:
      match: h-adashx.ut.taobao.com
      policy: REJECT
  - domain:
      match: adx-core.youku.com
      policy: REJECT
  - domain:
      match: adx-open-service.youku.com
      policy: REJECT
  - domain:
      match: yk-ssp.ad.youku.com
      policy: REJECT
  - domain:
      match: cad.youku.com
      policy: REJECT
  - domain:
      match: ykad-data.youku.com
      policy: REJECT
  - domain:
      match: amdc.m.youku.com
      policy: REJECT
  - domain:
      match: nbsdk-baichuan.alicdn.com
      policy: REJECT
  - domain:
      match: youku-crm-product.youku.com
      policy: REJECT
  - domain:
      match: dr-danmu.youku.com
      policy: REJECT
  - domain:
      match: group-ssl-danmu-ori.youku.com
      policy: REJECT
  - domain:
      match: m.atm.youku.com
      policy: REJECT
  - domain:
      match: mc.atm.youku.com
      policy: REJECT
  - domain:
      match: vali-g1.cp31.ott.cibntv.net
      policy: REJECT
  - domain:
      match: vali-ugc.cp31.ott.cibntv.net
      policy: REJECT
  - domain_suffix:
      match: iyes.youku.com
      policy: REJECT
  - domain:
      match: adsmind.ugdtimg.com
      policy: REJECT
  - domain:
      match: pre-acs.youku.com
      policy: REJECT
  - domain:
      match: youku-acs.m.taobao.com
      policy: REJECT
rewrites:
  - match: '(?i)^https://un-acs\.youku\.com/gw/mtop\.youku\.play\.ups\.appinfo\.get'
    actions:
      - response_body:
          jq: 'delpaths([["data","data","ad"],["data","data","watermark"],["data","data","ykad"]])'
  - match: '(?i)^https://push\.m\.youku\.com/collect-api/get_push_interval_config_wx\?'
    actions:
      - response_body:
          jq: 'delpaths([["data","tipContent"],["data","tipContentNew"]])'
mitm:
  hostnames:
    includes:
      - push.m.youku.com
      - un-acs.youku.com
