mitm:
  hostnames:
    includes:
    - dualsubs.github.io
    - www.youtube.com
    - m.youtube.com
    - tv.youtube.com
    - music.youtube.com
    - youtubei.googleapis.com
    - '*.googlevideo.com'
    excludes:
    - redirector*.googlevideo.com
env_schema:
  Type:
    name: '[字幕] 处理方式'
    description: 官方字幕使用 YouTube 翻译轨道；翻译引擎模式另外调用翻译服务。
    default_value: 官方字幕（双语合成）
    options:
    - 官方字幕（双语合成）
    - 翻译字幕（翻译引擎）
  AutoCC:
    name: '[字幕] 自动显示'
    description: 开启后自动显示字幕；关闭后不强制开启，沿用App自己的选择。视频仍需提供字幕轨道。
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ShowOnly:
    name: '[字幕] 仅显示译文'
    description: 关闭为“原文＋译文”；开启后仅显示译文。
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  Position:
    name: '[字幕] 原文位置'
    description: 仅在双语显示时区分原文与译文的上下顺序。
    default_value: 原文在上（第一行）
    options:
    - 原文在上（第一行）
    - 原文在下（第二行）
  Vendor:
    name: '[翻译] 服务商'
    description: Google 通常无需密钥；Microsoft 的 API 信息在官方在线设置中填写。
    default_value: Google（免配置）
    options:
    - Google（免配置）
    - Microsoft（需 API）
  Storage:
    name: '[设置] 优先使用哪处设置'
    description: 默认使用本页设置；选“在线设置优先”后，官方设置面板或 BoxJS 保存的同名参数可覆盖本页。
    default_value: 模块设置优先
    options:
    - 模块设置优先
    - 官方在线设置优先
    - 仅使用脚本默认值
  LogLevel:
    name: '[调试] 日志等级'
    description: 正常使用选“警告”或“关闭”；排查异常时再开启调试。
    default_value: 警告
    options:
    - 关闭
    - 仅错误
    - 警告
    - 信息
    - 调试
    - 全部
