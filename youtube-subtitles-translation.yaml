name: YouTube双语翻译©️
description: '官方版本：v1.6.0；更新时间：2026-11-01 08:27

  YouTube 增强及双语字幕(歌词)

  同步状态：官方发布版同步正常；最近检查：2026-11-01 08:34'
compat_arguments:
  Type: Official
  Types: Translate
  AutoCC: 'true'
  Position: Forward
  Vendor: Google
  ShowOnly: 'false'
  Storage: PersistentStore
  LogLevel: WARN
compat_arguments_desc: "Type: [字幕] 启用类型\n    ├ Official: 官方字幕（合成器）\n    └ Translate: 翻译字幕（翻译器）\n请选择要使用的字幕，双语字幕将使用您选择类型呈现。\n\nTypes: [歌词] 启用类型\n    └ Translate: 翻译歌词（翻译器）\n请选择要添加的歌词选项，如果为多选，则会自动决定提供的歌词类型。\n\nAutoCC: [字幕] 自动显示\n是否总是自动开启字幕显示。\n\nPosition: [字幕] 主语言（源语言）字幕位置\n    ├ Forward: 上面（第一行）\n    └ Reverse: 下面（第二行）\n主语言（源语言）字幕的显示位置。\n\nVendor: [翻译器] 服务商API\n    ├ Google: Google Translate\n    └ Microsoft: Microsoft Translator（需填写API）\n请选择翻译器所使用的服务商API，更多翻译选项请使用BoxJs。\n\nShowOnly: [翻译器] 只显示“自动翻译”字幕\n是否仅显示“自动翻译”字幕，不显示源语言字幕。\n\nStorage: [储存] 配置类型\n    ├ Argument: 插件配置优先\n    ├ PersistentStore: 持久化存储优先\n    └ database: 仅使用默认配置\n默认优先使用设置面板或 BoxJS 保存的配置，其次使用插件配置，最后使用脚本默认配置。\n\nLogLevel: [调试] 日志等级\n    ├ OFF: 关闭\n    ├ ERROR: ❌ 错误\n    ├ WARN: ⚠️ 警告\n    ├ INFO: ℹ️ 信息\n    ├ DEBUG: \U0001F171️ 调试\n    └ ALL: 全部\n选择脚本日志的输出等级，低于所选等级的日志将全部输出。\n"
open_url: https://dualsubs.github.io/preferences/
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://DualSubs.github.io/guide/youtube
icon: https://github.com/DualSubs/YouTube/raw/main/src/assets/icon_rounded.png
dns: {}
rules:
- url_regex:
    match: ^https?:\/\/([\w-]+)\.googlevideo\.com\/initplayback(\?.*oad=.+)$
    policy: REJECT
map_locals:
- match: ^https:\/\/dualsubs\.github\.io\/api\/YouTube(?:\?.*)?$
  to: https://github.com/DualSubs/YouTube/releases/download/v1.6.0/DualSubs.YouTube.PreferencePanes.json
  status_code: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Cache-Control: no-store
    X-PreferencePanes-Version: 1.6.0
scriptings:
- http_request:
    name: PreferencePanes.API
    match: ^https:\/\/dualsubs\.github\.io\/api\/(?:get|set|delete)(?:\?.*)?$
    script_url: https://github.com/NSNanoCat/PreferencePanes/releases/download/v1.3.1/api.js
    max_size: 65536
    body_required: true
- http_request:
    name: 🍿️ DualSubs.YouTube.Player.request.json
    match: ^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$
    script_url: https://github.com/DualSubs/YouTube/releases/download/v1.6.0/request.bundle.js
    env:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 🍿️ DualSubs.YouTube.Player.response.json
    match: ^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$
    script_url: https://github.com/DualSubs/YouTube/releases/download/v1.6.0/response.bundle.js
    env:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_request:
    name: 🍿️ DualSubs.YouTube.Player.request.proto
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/player(\?.+)?$
    script_url: https://github.com/DualSubs/YouTube/releases/download/v1.6.0/request.bundle.js
    env:
      _compat.$argument: Type="{{{Type}}}"&Types="{{{Types}}}"&AutoCC="{{{AutoCC}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
