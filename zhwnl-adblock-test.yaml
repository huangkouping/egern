name: 中华万年历去广告🅥（测试版）
description: |-
  过滤广告及推广，精简页面，剔除插屏与屏保（修复 JQ select 作用域 bug）。
  更新时间：2026-11-02 14:49
open_url: https://apps.apple.com/app/id505424979
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], 优化修正版
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/EtouchEcalendar.png

dns: {}

rules:
  # 拦截自有广告与第三方联盟 SDK 域名
  - domain:
      match: sdk.ad.sfys365.com
      policy: REJECT
  - domain:
      match: ad.etouch.cn
      policy: REJECT
  - domain:
      match: ad-tracker.suishenyun.net
      policy: REJECT

rewrites:
  # 语音房入口拦截
  - match: "(?i)^https?://client-lz\\.rili\\.cn/lizhi/api/auth/voice_room_entrance/list([/?]|$)"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":0,"data":[]}'

  # 首页日历卡片模块：剔除“每日插屏”与“下拉屏保”，只保留天气与核心工具
  - match: "(?i)^https?://v0-client-lz\\.rili\\.cn/lizhi/api/zhwnl/cal_module/(datas|config)([/?]|$)"
    actions:
      - response_body:
          jq: >-
            if .data? then
              .data |= map(select(
                .module_name as $name |
                ["实用工具","会员下icon","天气页面_右上角图标","天气页面_24小时","天气页面_15日","星座Tab（黄历页）"]
                | index($name) != null
              ))
            else . end

  # 广告池接口过滤：修复 select 作用域问题，确保响应结构完好
  - match: "(?i)^https?://pc\\.suishenyun\\.net/peacock/api/adspool([/?]|$)"
    actions:
      - response_body:
          jq: >-
            if .data? then
              .data |= map(
                if .layout? then
                  .layout |= map(select(
                    .key_name == "实用工具" or
                    .key_name == "会员下icon" or
                    .key_name == "天气页面_右上角图标" or
                    .key_name == "天气页面_24小时" or
                    .key_name == "天气页面_15日" or
                    .key_name == "星座Tab（黄历页）"
                  ))
                else . end
              )
            else . end

  # 杂项推广、卡片置空（返回标准包装格式）
  - match: "(?i)^https?://client-lz\\.rili\\.cn/lizhi/api/(fortune/question_spots/panel|jujia/flow|album/hl_card|fortune/overview)([/?]|$)"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: '{"code":0,"data":{}}'

mitm:
  hostnames:
    includes:
      - v0-client-lz.rili.cn
      - client-lz.rili.cn
      - pc.suishenyun.net
