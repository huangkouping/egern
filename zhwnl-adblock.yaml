name: 中华万年历去广告©️
description: |-
  过滤广告及推广，精简页面。
  更新时间：2026-10-31 21:03
open_url: https://apps.apple.com/app/id505424979
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/EtouchEcalendar.png

# 基于用户提供的完整配置备份，保留原处理逻辑。
# 无远程 JS/jq 依赖；手动维护，未配置上游定时同步。
dns: {}
rules:
  - domain:
      match: sdk.ad.sfys365.com
      policy: REJECT
rewrites:
  - match: "(?i)^https://client-lz\\.rili\\.cn/lizhi/api/auth/voice_room_entrance/list\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://v0-client-lz\\.rili\\.cn/lizhi/api/zhwnl/cal_module/(datas|config)\\?"
    actions:
      - response_body:
          jq: ".data |= map(select(.module_name as $name | [\"实用工具\",\"会员下icon\",\"天气页面_右上角图标\",\"天气页面_24小时\",\"天气页面_15日\",\"每日插屏\",\"下拉屏保\",\"星座Tab（黄历页）\"] | index($name) != null))"
  - match: "(?i)^http://pc\\.suishenyun\\.net/peacock/api/adspool\\?"
    actions:
      - response_body:
          jq: ".data |= map((.layout |= map(select(.key_name == \"实用工具\" or .key_name == \"会员下icon\" or .key_name == \"天气页面_右上角图标\" or .key_name == \"天气页面_24小时\" or .key_name == \"天气页面_15日\" or .key_name == \"每日插屏\" or .key_name == \"下拉屏保\" or .key_name == \"星座Tab（黄历页）\"))) | select(.layout | length > 0))"
  - match: "(?i)^https://client-lz\\.rili\\.cn/lizhi/api/fortune/question_spots/panel\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://client-lz\\.rili\\.cn/lizhi/api/jujia/flow\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://client-lz\\.rili\\.cn/lizhi/api/album/hl_card\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
  - match: "(?i)^https://client-lz\\.rili\\.cn/lizhi/api/fortune/overview\\?"
    actions:
      - respond:
          status: 200
          headers: {"Content-Type":"application/json"}
          body: "{}"
mitm:
  hostnames:
    includes:
      - v0-client-lz.rili.cn
      - client-lz.rili.cn
